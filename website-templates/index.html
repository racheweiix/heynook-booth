42\" rx=\"7\" ry=\"11\" fill=\"#7C7CF2\" transform=\"rotate(60 30 52)\"/><ellipse cx=\"30\" cy=\"42\" rx=\"7\" ry=\"11\" fill=\"#7C7CF2\" transform=\"rotate(120 30 52)\"/><ellipse cx=\"30\" cy=\"42\" rx=\"7\" ry=\"11\" fill=\"#7C7CF2\" transform=\"rotate(180 30 52)\"/><ellipse cx=\"30\" cy=\"42\" rx=\"7\" ry=\"11\" fill=\"#7C7CF2\" transform=\"rotate(240 30 52)\"/><ellipse cx=\"30\" cy=\"42\" rx=\"7\" ry=\"11\" fill=\"#7C7CF2\" transform=\"rotate(300 30 52)\"/><circle cx=\"30\" cy=\"52\" r=\"6.5\" fill=\"#F5C243\"/><\/svg><span class=\"st-num\">1<\/span><\/div>\n        <div class=\"st-body\"><h3>Sustainable product showcase<\/h3><p>Pick up products made with less: recycled materials, refills and things built to last. Ask the makers how they did it.<\/p><div class=\"st-foot\">Look and ask<span class=\"chip\">+1 pt<\/span><\/div><\/div>\n      <\/li>\n      <li class=\"st\">\n        <div class=\"st-plot\"><svg class=\"fl\" viewBox=\"0 0 60 150\" aria-hidden=\"true\"><path d=\"M30 150Q34 97 30 44\" fill=\"none\" stroke=\"#4CAF62\" stroke-width=\"3.2\" stroke-linecap=\"round\"/><ellipse cx=\"34\" cy=\"106\" rx=\"11\" ry=\"5\" fill=\"#5DBF6E\" transform=\"rotate(-30 34 106)\"/><path d=\"M17 42Q17 18 23 12L27 25L30 9L33 25L37 12Q43 18 43 42Q43 56 30 56Q17 56 17 42Z\" fill=\"#7C7CF2\"/><\/svg><span class=\"st-num\">2<\/span><\/div>\n        <div class=\"st-body\"><h3>Explore Green Mobility<\/h3><p>Cleaner ways to move people and goods, from e-bikes and shared rides to charging a whole fleet.<\/p><div class=\"st-foot\">Try it out<span class=\"chip\">+1 pt<\/span><\/div><\/div>\n      <\/li>\n      <li class=\"st\">\n        <div class=\"st-plot\"><svg class=\"fl\" viewBox=\"0 0 60 150\" aria-hidden=\"true\"><path d=\"M30 150Q33 107 30 64\" fill=\"none\" stroke=\"#4CAF62\" stroke-width=\"3.2\" stroke-linecap=\"round\"/><ellipse cx=\"35\" cy=\"126\" rx=\"11\" ry=\"5\" fill=\"#5DBF6E\" transform=\"rotate(-30 35 126)\"/><ellipse cx=\"30\" cy=\"48\" rx=\"7\" ry=\"11\" fill=\"# \" transform=\"rotate(-30 36 108)\"/><ellipse cx=\"30\" cy=\"28\" rx=\"7\" ry=\"13\" fill=\"#8E8BFF\" transform=\"rotate(0 30 40)\"/><ellipse cx=\"30\" cy=\"28\" rx=\"7\" ry=\"13\" fill=\"#8E8BFF\" transform=\"rotate(60 30 40)\"/><ellipse cx=\"30\" cy=\"28\" rx=\"7\" ry=\"13\" fill=\"#8E8BFF\" transform=\"rotate(120 30 40)\"/><ellipse cx=\"30\" cy=\"28\" rx=\"7\" ry=\"13\" fill=\"#8E8BFF\" transform=\"rotate(180 30 40)\"/><ellipse cx=\"30\" cy=\"28\" rx=\"7\" ry=\"13\" fill=\"#8E8BFF\" transform=\"rotate(240 30 40)\"/><ellipse cx=\"30\" cy=\"28\" rx=\"7\" ry=\"13\" fill=\"#8E8BFF\" transform=\"rotate(300 30 40)\"/><circle cx=\"30\" cy=\"40\" r=\"6.5\" fill=\"#FFD95A\"/><\/svg><\/div>\n  <div class=\"soil-strip\" aria-hidden=\"true\"><\/div>\n  <div class=\"wrap bloom-grid\">\n    <div>\n      <div class=\"sec-head\">\n        <span class=\"eyebrow\">Full bloom<\/span>\n        <h2>Five flowers, one prize<\/h2>\n        <p class=\"lede\">When the last flower comes up, your whole garden blooms at once and your prize is unlocked, right there on your phone.<\/p>\n      <\/div>\n      <div class=\"track\" role=\"img\" aria-label=\"Five stations, one point each, five points for the prize\">\n        <div class=\"track-row\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n        <div class=\"track-lbl\"><span>1 pt<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5 pts · prize<\/span><\/div>\n      <\/div>\n      <ul class=\"notes\">\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M5 19c0-8 5-13 14-14-1 9-6 14-14 14zM5 19l7-7\"/><\/svg><span>Each station counts once, so all five means all five.<\/span><\/li>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M5 19c0-8 5-13 14-14-1 9-6 14-14 14zM5 19l7-7\"/><\/svg><span>Show your garden in full bloom at the prize desk.<\/span><\/li>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M5 19c0-8 5-13 14-14-1 9-6 14-14 14zM5 19l7-7\"/><\/svg><span>Missed one? Your passport shows which plots are still waiting.<\/span><\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"fin-stage\" aria-hidden=\"true\">\n      <i class=\"petal\" style=\"left:12%;top:18%;background:#8C88FF;transform:rotate(20deg)\"><\/i>\n      <i class=\"petal\" style=\"left:80%;top:12%;background:#F5C243;transform:rotate(-40deg)\"><\/i>\n      <i class=\"petal\" style=\"left:6%;top:62%;background:#F4A6C8;transform:rotate(70deg)\"><\/i>\n      <i class=\"petal\" style=\"left:88%;top:58%;background:#B9E59A;transform:rotate(10deg)\"><\/i>\n      <i class=\"petal\" style=\"left:24%;top:4%;background:#FFFFFF;transform:rotate(-15deg)\"><\/i>\n      <i class=\"petal\" style=\"left:70%;top:86%;background:#8C88FF;transform:rotate(45deg)\"><\/i>\n      <div class=\"fin-card\">\n        <div class=\"fin-ic\">🌷<\/div>\n        <h3>Your garden is in full bloom<\/h3>\n        <p>All 5 stations collected. Your prize is unlocked.<\/p>\n        <div class=\"fin-acts\"><span>Start over<\/span><span>Keep looking<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"faq\" class=\"wrap\">\n  <div class=\"faq-grid\">\n    <div class=\"sec-head\">\n      <span class=\"eyebrow\">Good to know<\/span>\n      <h2>Questions, answered<\/h2>\n      <p>Anything else? Ask any station team on the day.<\/p>\n    <\/div>\n    <div class=\"faq-list\">\n      <details class=\"qa\" open><summary class=\"qa-q\">Do I need to download an app?<\/summary><p class=\"qa-a\">No. Your passport opens in the browser from the link in your confirmation email.<\/p><\/details>\n      <details class=\"qa\"><summary class=\"qa-q\">Do I have to visit the stations in order?<\/summary><p class=\"qa-a\">No. Every station has its own plot, so its flower comes up whenever you get there.<\/p><\/details>\n      <details class=\"qa\"><summary class=\"qa-q\">Can a station count twice?<\/summary><p class=\"qa-a\">No. Each station counts once and is worth 1 pt, so the garden tops out at 5.<\/p><\/details>\n      <details class=\"qa\"><summary class=\"qa-q\">What if my scan doesn't show up?<\/summary><p class=\"qa-a\">Ask the station team to scan you again. The flower appears as soon as your QR is verified.<\/p><\/details>\n      <details class=\"qa\"><summary class=\"qa-q\">Where do I collect my prize?<\/summary><p class=\"qa-a\">Once your garden is in full bloom, show your passport at the prize desk.<\/p><\/details>\n      <details class=\"qa\"><summary class=\"qa-q\">Is the passport on this page real?<\/summary><p class=\"qa-a\">It's a demo. Press Tap to scan to see what happens at each station. Nothing you do here is saved.<\/p><\/details>\n    <\/div>\n  <\/div>\n<\/section>\n\n<div class=\"wrap\">\n  <div class=\"closing\">\n    <svg class=\"vine\" viewBox=\"0 0 170 260\" aria-hidden=\"true\"><path d=\"M168 0C150 60 120 120 70 250\" fill=\"none\" stroke=\"#7DBE6C\" stroke-width=\"4\"/><g fill=\"#7DBE6C\"><ellipse cx=\"150\" cy=\"40\" rx=\"26\" ry=\"12\" transform=\"rotate(-30 150 40)\"/><ellipse cx=\"112\" cy=\"70\" rx=\"28\" ry=\"12\" transform=\"rotate(20 112 70)\"/><ellipse cx=\"140\" cy=\"110\" rx=\"26\" ry=\"11\" transform=\"rotate(-35 140 110)\"/><\/g><\/svg>\n    <div>\n      <h2>Ready to grow your garden?<\/h2>\n      <p>Open the demo passport and plant all five flowers yourself. It takes about a minute.<\/p>\n    <\/div>\n    <div class=\"ctas\">\n      <button class=\"btn btn-peri js-full\" type=\"button\">Try it full screen<\/button>\n      <a class=\"btn btn-soft\" href=\"#stations\">See the stations<\/a>\n    <\/div>\n  <\/div>\n<\/div>\n<\/main>\n\n<div class=\"wrap\">\n  <footer><span>Sustainability First: an ESG Summit · a sample event for showcase<\/span><span>Powered by <b>eventnook<\/b><\/span><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"ov\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Demo passport, full screen\" hidden>\n  <div class=\"ov-frame\">\n    <iframe id=\"pp-full\" title=\"Sustainability First demo passport, full screen\"><\/iframe>\n  <\/div>\n  <button class=\"ov-close\" type=\"button\" id=\"ov-close\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg>Close<\/button>\n<\/div>\n\n<script>\n(function () {\n  var ov = document.getElementById('ov');\n  var full = document.getElementById('pp-full');\n  var inline = document.getElementById('pp-inline');\n  var closeBtn = document.getElementById('ov-close');\n  var last = null;\n  function open(e) {\n    last = e && e.currentTarget;\n    full.setAttribute('srcdoc', inline.getAttribute('srcdoc'));\n    ov.hidden = false;\n    ov.classList.add('open');\n    document.body.classList.add('no-scroll');\n    closeBtn.focus();\n  }\n  function close() {\n    if (ov.hidden) return;\n    ov.classList.remove('open');\n    ov.hidden = true;\n    document.body.classList.remove('no-scroll');\n    full.removeAttribute('srcdoc');\n    full.src = 'about:blank';\n    if (last) last.focus();\n  }\n  document.querySelectorAll('.js-full').forEach(function (b) { b.addEventListener('click', open); });\n  closeBtn.addEventListener('click', close);\n  ov.addEventListener('click', function (e) { if (e.target === ov) close(); });\n  document.addEventListener('keydown', function (e) {\n    if (ov.hidden) return;\n    if (e.key === 'Escape') close();\n  });\n  // Escape pressed while focus is inside the passport frame\n  full.addEventListener('load', function () {\n    try { var w = full.contentWindow;\n      w.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !w.document.querySelector('.fin.on')) close(); }, true); } catch (err) {}\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "RE:Think AI", "tag": "Circuit-board datasheet · five parts close the circuit", "live": "https://rethink-ai-summit.eventnook.site/", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>RE:Think AI<\/title>\n<meta name=\"description\" content=\"A hands-on AI day built like a circuit board. Visit five stations, light up five parts on your digital passport and unlock your prize.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap\" rel=\"stylesheet\">\n<style>\n/* Layout: the page is a printed circuit board read like a datasheet. A lit bus runs through it; each station is a part on the board. */\n:root {\n  color-scheme: dark;\n  --bg: #2C2F78;\n  --bg-hi: #363B90;\n  --panel: rgba(58, 62, 150, .55);\n  --panel-solid: #34388A;\n  --edge: rgba(150, 156, 255, .8);\n  --edge-soft: rgba(150, 156, 255, .32);\n  --trace: rgba(165, 170, 225, .32);\n  --hot: #8E92FF;\n  --btn: #7F84F5;\n  --ink: #ECEDFF;\n  --mute: #C9CAEF;\n  --des: #9DA1FF;\n  --gold: #E6C34A;\n  --scan: #9AE6FF;\n  --deep: #2E3290;\n  --night: #151C2E;\n  --pale: #E4E5FF;\n  --pale-ink: #1A1530;\n  --pale-mute: #4B4763;\n  --sans: \"DM Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --mono: \"DM Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n  --r: 20px;\n  --gutter: 16px;\n}\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; background: var(--bg); }\nbody {\n  margin: 0; color: var(--ink); font: 400 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;\n  background:\n    radial-gradient(rgba(185, 190, 255, .16) 1px, transparent 1.4px) 0 0 / 12px 12px,\n    linear-gradient(180deg, #30337E 0%, #2B2E74 45%, #363B90 100%);\n}\na { color: inherit; }\nimg, svg, iframe { max-width: 100%; display: block; }\nh1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; text-wrap: balance; }\nh2 { font-size: clamp(32px, 4.6vw, 54px); }\nh3 { font-size: 20px; letter-spacing: -.02em; line-height: 1.2; font-weight: 700; }\nsection { padding-block: 88px; }\n\n.wrap { max-width: 1200px; margin: 0 auto; padding-inline: var(--gutter); }\n.skip { position: absolute; left: 16px; top: -60px; background: var(--pale); color: var(--pale-ink); padding: 10px 16px; border-radius: 10px; z-index: 100; font-weight: 700; }\n.skip:focus { top: 12px; }\n.mono { font-family: var(--mono); }\n.des { font: 500 13px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--des); }\n.kicker { display: inline-flex; align-items: center; gap: 12px; font: 500 13px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--des); }\n.kicker::before { content: \"\"; width: 12px; height: 12px; border-radius: 50%; background: #7A7FB8; transition: background .6s ease, box-shadow .6s ease; }\n.lit .kicker::before, .kicker.on::before { background: var(--hot); box-shadow: 0 0 12px var(--hot); }\n.lede { color: var(--mute); font-size: 19px; margin: 0; max-width: 36ch; }\n.sec-head { display: grid; gap: 16px; max-width: 660px; margin-bottom: 48px; }\n.sec-head .lede { max-width: 48ch; }\n\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 999px; font: 700 16px/1 var(--sans); text-decoration: none; border: 1.5px solid transparent; cursor: pointer; white-space: nowrap; transition: transform .15s ease, background-color .15s ease, box-shadow .2s ease; }\n.btn svg { width: 20px; height: 20px; flex: none; }\n.btn-primary { background: var(--btn); color: #fff; box-shadow: 0 12px 28px -10px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .2); }\n.btn-primary:hover { background: var(--hot); transform: translateY(-1px); box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .5), 0 0 22px rgba(142, 146, 255, .55); }\n.btn-ghost { background: transparent; color: var(--ink); border-color: rgba(255, 255, 255, .35); }\n.btn-ghost:hover { border-color: var(--ink); background: rgba(255, 255, 255, .06); }\na:focus-visible, .btn:focus-visible, .faq-q:focus-visible, .ov-close:focus-visible, .skip:focus-visible { outline: 3px solid var(--scan); outline-offset: 3px; }\n\n/* nav */\n.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }\n.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }\n.brand-mark { width: 40px; height: 40px; flex: none; }\n.nav-links { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; font-weight: 500; font-size: 15px; }\n.nav-links a { text-decoration: none; color: var(--mute); }\n.nav-links a:hover { color: var(--ink); }\n.nav .btn { min-height: 44px; padding: 0 18px; font-size: 15px; }\n@media (max-width: 820px) { .nav-links { display: none; } }\n\n/* hero */\n.hero { display: grid; grid-template-columns: 1.02fr .98fr; gap: 40px; align-items: center; padding-block: 48px 40px; }\n.hero h1 { font-size: clamp(42px, 5.6vw, 76px); letter-spacing: -.045em; line-height: .98; margin-top: 22px; }\n.hero h1 .glow { display: block; color: var(--hot); text-shadow: 0 0 28px rgba(142, 146, 255, .55); }\n.hero .lede { margin-top: 24px; }\n.specs { display: grid; width: max-content; max-width: 100%; grid-template-columns: repeat(3, auto); justify-content: start; gap: 0; margin: 32px 0; padding: 0; list-style: none; border: 1.5px solid var(--edge-soft); border-radius: 14px; overflow: hidden; }\n.specs li { padding: 12px 20px; border-left: 1.5px solid var(--edge-soft); }\n.specs li:first-child { border-left: 0; }\n.specs b { display: block; font-size: 26px; line-height: 1; letter-spacing: -.03em; }\n.specs span { display: block; margin-top: 6px; font: 400 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--des); }\n.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }\n.board { position: relative; }\n.board-svg { width: 100%; height: auto; overflow: visible; }\n.board-svg .trace { fill: none; stroke: var(--trace); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }\n.board-svg .trace-on { stroke: var(--hot); filter: drop-shadow(0 0 6px var(--hot)); }\n.board-svg .pulse { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 6 260; stroke-dashoffset: 0; animation: flow 2.6s linear infinite; }\n.board-svg .b-des { font: 500 15px var(--mono); letter-spacing: .08em; fill: var(--des); }\n.board-svg .b-name { font: 700 16px var(--sans); fill: var(--ink); }\n@keyframes flow { to { stroke-dashoffset: -266; } }\n@media (max-width: 960px) {\n  .hero { grid-template-columns: 1fr; gap: 28px; padding-block: 20px 56px; }\n  .board { max-width: 560px; }\n}\n\n/* pinout (how it works) */\n.pinout { display: grid; grid-template-columns: 1fr 384px 1fr; gap: 0 56px; align-items: center; }\n.pins { list-style: none; margin: 0; padding: 0; display: grid; gap: 28px; }\n.pin { position: relative; background: var(--panel); border: 1.5px solid var(--edge-soft); border-radius: 18px; padding: 20px 22px; }\n.pin .des { display: block; margin-bottom: 10px; }\n.pin h3 { font-size: 19px; }\n.pin p { margin: 6px 0 0; color: var(--mute); font-size: 15.5px; line-height: 1.5; }\n.pin::after { content: \"\"; position: absolute; top: 50%; width: 56px; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--trace); transition: background .6s ease, box-shadow .6s ease; }\n.pin::before { content: \"\"; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: #7A7FB8; z-index: 1; transition: background .6s ease, box-shadow .6s ease; }\n.pins-l .pin::after { right: -58px; }\n.pins-l .pin::before { right: -66px; }\n.pins-r .pin::after { left: -58px; }\n.pins-r .pin::before { left: -66px; }\n.lit .pin::after, .lit .pin::before { background: var(--hot); box-shadow: 0 0 10px var(--hot); }\n.phone-col { display: grid; justify-items: center; gap: 18px; }\n.phone { position: relative; width: 100%; max-width: 384px; padding: 12px; border-radius: 48px; background: var(--night); border: 2px solid var(--edge); box-shadow: 0 0 0 6px rgba(127, 132, 245, .14), 0 0 60px rgba(142, 146, 255, .35), 0 40px 80px -30px rgba(0, 0, 0, .6); }\n.phone::before, .phone::after { content: \"\"; position: absolute; left: 60px; right: 60px; height: 10px; background: repeating-linear-gradient(90deg, rgba(175, 180, 255, .8) 0 4px, transparent 4px 11px); }\n.phone::before { top: -14px; }\n.phone::after { bottom: -14px; }\n.phone iframe { width: 100%; height: 740px; border: 0; border-radius: 37px; background: var(--bg); }\n.phone-cap { margin: 8px 0 0; text-align: center; color: var(--mute); font-size: 15px; max-width: 34ch; }\n.phone-cap b { color: var(--ink); }\n@media (max-width: 1100px) {\n  .pinout { grid-template-columns: 1fr; gap: 16px; }\n  .phone-col { margin-bottom: 24px; }\n  .phone-col { order: -1; }\n  .pins { grid-template-columns: 1fr 1fr; gap: 16px; }\n  .pin::after, .pin::before { display: none; }\n}\n@media (max-width: 640px) {\n  .pins { grid-template-columns: 1fr; }\n  .phone { border-radius: 40px; padding: 10px; }\n  .phone iframe { height: 620px; border-radius: 31px; }\n}\n\n/* stations (parts list) */\n.bom { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; list-style: none; margin: 0; padding: 40px 0 0; }\n.bom::before { content: \"\"; position: absolute; left: 10%; right: 10%; top: 0; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--trace); }\n.bom::after { content: \"\"; position: absolute; left: 10%; right: 10%; top: 0; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--hot); box-shadow: 0 0 12px var(--hot); transform: scaleX(0); transform-origin: left; transition: transform 1.6s cubic-bezier(.5, 0, .3, 1); }\n.lit .bom::after { transform: scaleX(1); }\n.part { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; background: var(--panel); border: 1.5px solid var(--edge-soft); border-radius: var(--r); padding: 0 20px 20px; box-shadow: inset 0 0 30px rgba(127, 132, 245, .14); }\n.part::before { content: \"\"; position: absolute; left: 50%; top: -40px; width: 6px; height: 40px; margin-left: -3px; background: var(--trace); transition: background .5s ease .9s, box-shadow .5s ease .9s; }\n.part::after { content: \"\"; position: absolute; left: 50%; top: -11px; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #7A7FB8; transition: background .5s ease .9s, box-shadow .5s ease .9s; transform: translateY(-29px); }\n.lit .part::before, .lit .part::after { background: var(--hot); box-shadow: 0 0 10px var(--hot); }\n.part-art { height: 130px; display: grid; place-items: center; }\n.part-svg { height: auto; filter: drop-shadow(0 0 12px rgba(142, 146, 255, .55)); }\n.part-chip, .part-cap { width: 84px; }\n.part-res { width: 124px; }\n.part-dimm { width: 136px; }\n.part-tran { width: 78px; }\n.part h3 { margin-top: 10px; }\n.part p { margin: 8px 0 18px; color: var(--mute); font-size: 15px; line-height: 1.5; }\n.worth { justify-self: start; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .35); font-weight: 700; font-size: 14.5px; }\n.worth::before { content: \"\"; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }\n.bom-total { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; margin-top: 28px; padding: 18px 22px; border-radius: 16px; border: 1.5px dashed var(--edge-soft); font: 400 14px/1.4 var(--mono); letter-spacing: .06em; color: var(--mute); }\n.bom-total b { color: var(--ink); font-weight: 500; }\n@media (max-width: 1100px) {\n  .bom { grid-template-columns: 1fr 1fr; padding: 0 0 0 44px; gap: 20px; }\n  .bom::before, .bom::after { left: 18px; right: auto; top: 0; bottom: 0; width: 6px; height: auto; margin: 0; }\n  .bom::after { transform: scaleY(0); transform-origin: top; }\n  .lit .bom::after { transform: scaleY(1); }\n  .part::before { left: -26px; top: 64px; width: 26px; height: 6px; margin: -3px 0 0; }\n  .part::after { left: -26px; top: 64px; transform: none; }\n}\n@media (max-width: 700px) {\n  .bom { grid-template-columns: 1fr; }\n  .part { grid-template-columns: 96px 1fr; grid-template-rows: auto auto auto; column-gap: 14px; padding: 18px; }\n  .part-art { grid-row: 1 / 4; height: auto; align-self: start; padding-top: 8px; }\n  .part-res, .part-dimm { width: 92px; }\n  .part-chip, .part-cap { width: 70px; }\n  .part-tran { width: 60px; }\n  .part h3 { margin-top: 8px; }\n  .part::before, .part::after { top: 50px; }\n}\n\n/* prize */\n.prize { background: var(--pale); color: var(--pale-ink); border-radius: 40px; padding: 72px 64px; display: grid; grid-template-columns: .9fr 1.1fr; gap: 64px; align-items: center; position: relative; overflow: hidden; }\n.prize::before { content: \"\"; position: absolute; inset: 0; background: radial-gradient(rgba(46, 50, 144, .1) 1px, transparent 1.4px) 0 0 / 12px 12px; pointer-events: none; }\n.prize > * { position: relative; }\n.prize .kicker { color: var(--deep); }\n.prize .lede { color: var(--pale-mute); }\n.prize h2 { color: var(--deep); }\n.fin-stage { display: grid; place-items: center; padding: 40px 0 0; }\n.fin-card { width: min(100%, 360px); background: #fff; border-radius: 28px; padding: 30px 26px 26px; text-align: center; box-shadow: 0 30px 60px -24px rgba(46, 50, 144, .55), 0 0 0 1px rgba(46, 50, 144, .06); }\n.fin-ic { width: 86px; height: 86px; margin: -74px auto 14px; border-radius: 50%; display: grid; pl on>\n  <\/div>\n\n  <div class=\"wrap\">\n    <section id=\"prize\" aria-labelledby=\"pr-h\">\n      <div class=\"prize\">\n        <div class=\"fin-stage\">\n          <div class=\"fin-card\">\n            <div class=\"fin-ic\" aria-hidden=\"true\">⚡<\/div>\n            <h3>Circuit complete<\/h3>\n            <p>All 5 parts collected. Your prize is unlocked.<\/p>\n            <div class=\"fin-bar\" aria-hidden=\"true\"><\/div>\n            <div class=\"fin-row\" aria-label=\"Parts collected\"><span>U1<\/span><span>C2<\/span><span>R3<\/span><span>DIMM4<\/span><span>Q5<\/span><\/div>\n          <\/div>\n        <\/div>\n        <div>\n          <span class=\"kicker on\">The prize<\/span>\n          <h2 id=\"pr-h\" style=\"margin-top:16px\">Light all five.<br> Your prize unlocks.<\/h2>\n          <p class=\"lede\" style=\"margin-top:16px\">There's no leaderboard and no race. Finish the board at your own pace and the prize is yours.<\/p>\n          <ol class=\"steps-done\">\n            <li><b>The fifth part lands<\/b><span>Every branch of your board glows at once.<\/span><\/li>\n            <li><b>Current runs the bus<\/b><span>Sparks of light travel the full length of the circuit.<\/span><\/li>\n            <li><b>Your prize screen opens<\/b><span>Show it at the prize desk to collect.<\/span><\/li>\n          <\/ol>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"faq\" aria-labelledby=\"faq-h\">\n      <div class=\"faq\">\n        <div class=\"sec-head\">\n          <span class=\"kicker on\">Good to know<\/span>\n          <h2 id=\"faq-h\">Questions, answered<\/h2>\n          <p class=\"lede\">Anything else? Ask at any station. The team is there all day.<\/p>\n        <\/div>\n        <div class=\"faq-list\">\n          <details class=\"faq-item\" open><summary class=\"faq-q\">Do I need to download an app?<\/summary><p class=\"faq-a\">No. Your passport is a web page. It opens in your phone's browser from the link with your ticket.<\/p><\/details>\n          <details class=\"faq-item\"><summary class=\"faq-q\">Do I need to know about AI?<\/summary><p class=\"faq-a\">Not at all. Every station is made for a first try, and someone is on hand to walk you through it.<\/p><\/details>\n          <details class=\"faq-item\"><summary class=\"faq-q\">What is each station worth?<\/summary><p class=\"faq-a\">One point each, five in all. Each part can only be collected once, so the way to a full board is to try every station.<\/p><\/details>\n          <details class=\"faq-item\"><summary class=\"faq-q\">Can I visit the stations in any order?<\/summary><p class=\"faq-a\">Yes. Start wherever there's no queue. The part lights up on your board whenever its station scans you in.<\/p><\/details>\n          <details class=\"faq-item\"><summary class=\"faq-q\">How do I claim my prize?<\/summary><p class=\"faq-a\">Once all five parts are lit, your prize screen opens. Show it at the prize desk.<\/p><\/details>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <div class=\"closing\">\n      <div>\n        <span class=\"kicker on\">Ready?<\/span>\n        <h2 style=\"margin-top:16px\">Close the circuit<\/h2>\n        <p class=\"lede\">Open the sample passport and scan your way to a full board.<\/p>\n      <\/div>\n      <div class=\"cta-row\">\n        <button class=\"btn btn-primary\" type=\"button\" data-open-pp>Try the passport<\/button>\n        <a class=\"btn btn-ghost\" href=\"#stations\">See the stations<\/a>\n      <\/div>\n    <\/div>\n\n    <footer><span>RE:Think AI · a sample event for showcase<\/span><span>Powered by <b>eventnook<\/b><\/span><\/footer>\n  <\/div>\n<\/main>\n\n<div class=\"overlay\" id=\"pp-full\" role=\"dialog\" aria-modal=\"true\" aria-label=\"RE:Think AI passport, full screen\" hidden>\n  <div class=\"ov-box\">\n    <div class=\"ov-bar\"><span class=\"des\">Sample passport<\/span><button class=\"ov-close\" type=\"button\">Close <span aria-hidden=\"true\">✕<\/span><\/button><\/div>\n    <iframe add('lit'); io.unobserve(en.target); } });\n    }, { threshold: 0.2 });\n    lit.forEach(function (el) { io.observe(el); });\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "EventNook Family Day", "tag": "Fairground bingo board · fill every stop", "live": "https://eventnook-family-day.eventnook.site/", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>EventNook Family Day<\/title>\n<meta name=\"description\" content=\"A sample family day out: eight play stops and a free centre square on one digital passport. Three in a row wins a mini prize; a full board enters the grand prize draw.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Idea: the whole day is one 3 x 3 board, like the passport. The page is a fairground: striped bunting,\n   a ticket-booth for the passport, the nine stops laid out as the board itself, lines of three for prizes. */\n:root {\n  color-scheme: light;\n  --peach: #FDEFE6;\n  --blush: #FAD1E1;\n  --cream: #FFF8F2;\n  --pink: #E8458F;\n  --pink-deep: #C2185B;\n  --pink-soft: #F68BBE;\n  --orange: #F7894A;\n  --coral: #F06A6E;\n  --magenta: #EA4C97;\n  --yellow: #F5B700;\n  --yellow-soft: #FFE27A;\n  --red: #E2453A;\n  --ink: #2A1A22;\n  --ink-strong: #1C1218;\n  --mute: #5B4A53;\n  --dash: #CDBFC7;\n  --sunset: linear-gradient(100deg, #F7894A 0%, #F06A6E 45%, #EA4C97 100%);\n  --font: \"DM Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --gut: clamp(16px, 4vw, 40px);\n  --r: 22px;\n}\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }\nbody { margin: 0; background: var(--pea e { outline: 3px solid #00B0F0; outline-offset: 3px; }\n\n/* nav */\n.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px; }\n.brand { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; text-decoration: none; }\n.brand .ic { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(145deg, #5C86FF, #2747D8); display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35), 0 2px 8px rgba(0,0,0,.18); flex: none; }\n.brand .ic svg { width: 22px; height: 22px; }\n.nav-links { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; font-weight: 700; font-size: 15px; }\n.nav-links a { text-decoration: none; color: var(--mute); }\n.nav-links a:hover { color: var(--pink-deep); }\n.nav .btn { min-height: 44px; padding: 0 18px; font-size: 15px; }\n@media (max-width: 880px) { .nav-links { display: none; } }\n@media (max-width: 420px) { .brand .brand-full { display: none; } }\n\n/* hero */\n.hero { position: relative; background:\n  radial-gradient(circle, rgba(244,150,190,.55) 3.4px, transparent 3.8px) 0 0 / 46px 46px,\n  radial-gradient(circle, rgba(246,192,90,.6) 3.4px, transparent 3.8px) 23px 23px / 46px 46px,\n  repeating-linear-gradient(112deg, #FBDCE8 0 36px, var(--peach) 36px 72px);\n  padding-block: 0 clamp(56px, 7vw, 96px); overflow: hidden; }\n.bunting { width: 100%; height: 28px; }\n.bunting svg { width: 100%; height: 28px; max-width: none; }\n.bunting .flags { transform-origin: 50% 0; animation: sway 6s ease-in-out infinite alternate; }\n@keyframes sway { from { transform: rotate(-.4deg); } to { transform: rotate(.4deg); } }\n.hero-grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: clamp(32px, 5vw, 72px); align-items: center; padding-top: clamp(36px, 6vw, 80px); }\n.hero h1 { font-size: clamp(38px, 5.4vw, 76px); letter-spacing: -.05em; line olor: #fff; }\n.stop .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n.stop .ico { width: 44px; height: 44px; color: var(--pink); }\n.stop .txt { margin: 0; color: var(--mute); font-size: 15.5px; line-height: 1.5; }\n.stop .foot { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px; color: var(--mute); font-weight: 500; }\n.chip { display: inline-flex; align-items: center; font-weight: 800; font-size: 14px; padding: 4px 12px; border-radius: 999px; background: var(--blush); color: var(--pink-deep); }\n.stop.free { background: var(--pink); border: 2.5px solid var(--yellow); color: #fff; box-shadow: 0 0 0 5px rgba(245,183,0,.4), 0 0 30px rgba(245,183,0,.5); }\n.stop.free h3 { color: #fff; }\n.stop.free .txt, .stop.free .foot { color: #fff; }\n.stop.free .chip { background: var(--yellow); color: var(--ink-strong); }\n.stop.free .star { width: 46px; height: 46px; }\n.board-key { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 26px; margin-top: 34px; font-size: 15px; color: var(--mute); }\n.board-key span { display: inline-flex; align-items: center; gap: 8px; }\n.board-key i { width: 16px; height: 16px; border-radius: 5px; border: 2px dashed var(--dash); background: #FBF1F5; }\n.board-key i.f { border: 2px solid var(--yellow); background: var(--pink); }\n@media (max-width: 860px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stop.free { order: -1; grid-column: 1 / -1; } }\n@media (max-width: 560px) { .board { grid-template-columns: minmax(0, 1fr); } .stop { padding: 20px; } }\n\n/* prizes */\n.prizes { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 20px; }\n.card { border-radius: 30px; padding: clamp(24px, 3.4vw, 40px); }\n.card .txt { color: var(--mute); margin: 10px 0 0; }\n.p-lines { background: #fff; border: 2.5px solid var(--blush); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2 om/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&amp;display=swap&quot;&gt;\n&lt;style&gt;\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{-webkit-text-size-adjust:100%}\nbody{font-family:&#x27;DM Sans&#x27;,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n:focus-visible{outline:3px solid #00B0F0;outline-offset:3px}\nsvg{display:block}\nmain{position:relative;padding-bottom:120px}\n\n/* app bar */\n.top{display:flex;align-items:center;gap:12px;padding:14px 16px 13px;position:relative;z-index:5}\n.top .ic{flex:none;width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#5C86FF,#2747D8);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.25)}\n.top .ic svg{width:24px;height:24px}\n.top h1{font-size:18px;line-height:1.15;font-weight:700;letter-spacing:-.01em}\n.top p{font-size:13px;opacity:.82;margin-top:2px}\n.top .menu{margin-left:auto;width:26px;display:grid;gap:5px;opacity:.55;flex:none}\n.top .menu i{display:block;height:2px;border-radius:2px;background:currentColor}\n.dark{background:linear-gradient(180deg,#151C2E,#0F1524);color:#F2F4FF;box-shadow:0 1px 0 rgba(120,140,255,.3)}\n\n/* collected / not yet */\n[data-st]:not(.done) .y,[data-st].done .n{display:none!important}\n.when-complete{display:none!important}\nbody.complete .when-complete{display:inline!important}\nbody.complete .when-progress{display:none!important}\n\n/* tap to scan */\n#scan{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;padding:0 24px 0 18px;height:54px;border-radius:999px;background:var(--btn,#1E0E62);color:var(--btn-ink,#fff);font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 12px 28px -8px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.2);transition:transform P.finDelay || 1500);\n    }, 800);\n  }\n\n  function confetti() {\n    if (reduce) return;\n    const c = document.createElement(&#x27;div&#x27;); c.className = &#x27;conf&#x27;;\n    const cols = PP.confetti || [&#x27;#FF5C8A&#x27;, &#x27;#FFC93C&#x27;, &#x27;#5B8CFF&#x27;, &#x27;#3DD6A3&#x27;];\n    for (let k = 0; k &lt; 70; k++) {\n      const i = document.createElement(&#x27;i&#x27;);\n      i.style.cssText = `left:${Math.random() * 100}%;background:${cols[k % cols.length]};--d:${2.3 + Math.random() * 1.8}s;--dl:${Math.random() * .7}s;--dx:${(Math.random() - .5) * 170}px;--rot:${(Math.random() - .5) * 900}deg;${PP.confettiShape || &#x27;&#x27;}`;\n      c.appendChild(i);\n    }\n    document.body.appendChild(c); setTimeout(() =&gt; c.remove(), 5400);\n  }\n\n  function reset() {\n    fin.classList.remove(&#x27;on&#x27;); document.body.classList.remove(&#x27;finale&#x27;);\n    S.forEach((s, i) =&gt; { Object.assign(s, INIT[i]); if (!INIT[i].time) delete s.time; });\n    if (PP.reset) PP.reset();\n    render();\n    scrollTo({ top: 0, behavior: reduce ? &#x27;auto&#x27; : &#x27;smooth&#x27; });\n  }\n\n  btn.addEventListener(&#x27;click&#x27;, scan);\n  $(&#x27;.again&#x27;, fin).addEventListener(&#x27;click&#x27;, reset);\n  $(&#x27;.stay&#x27;, fin).addEventListener(&#x27;click&#x27;, () =&gt; fin.classList.remove(&#x27;on&#x27;));\n  addEventListener(&#x27;keydown&#x27;, e =&gt; { if (e.key === &#x27;Escape&#x27;) fin.classList.remove(&#x27;on&#x27;); });\n  render();\n})();\n\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\"><\/iframe>\n      <\/div>\n      <p class=\"booth-cap\">This is the demo passport. Press <b>Tap to scan<\/b> inside it to collect the next stop.<\/p>\n      <button class=\"btn btn-primary\" type=\"button\" data-open><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5\"/><\/svg>Try it full screen<\/button>\n    <\/div>\n\n    <div>\n      <div class=\"sec-head\">\n        <span class=\"kicker\">How the passport works<\/span>\n        <h2>Your passport lives on your phone<\/h2>\n        <p class=\"lead\">Every family gets a digital passport with their booking. It opens in the browser, so there is nothing to download.<\/p>\n      <\/div>\n      <ol class=\"tickets\">\n        <li class=\"ticket\"><span class=\"stub\">01<\/span><div class=\"body\"><h3>Open your passport<\/h3><p class=\"txt\">Tap the link in your confirmation email. You will see the board, your stamps and your points so far.<\/p><\/div><\/li>\n        <li class=\"ticket\"><span class=\"stub\">02<\/span><div class=\"body\"><h3>Play a stop, get scanned<\/h3><p class=\"txt\">Bowl, fish, paint or hunt. When you finish, the stop crew scans your passport QR.<\/p><\/div><\/li>\n        <li class=\"ticket\"><span class=\"stub\">03<\/span><div class=\"body\"><h3>Watch the stamp land<\/h3><p class=\"txt\">The square turns pink and your points go up by one. Each stop stamps once.<\/p><\/div><\/li>\n        <li class=\"ticket\"><span class=\"stub\">04<\/span><div class=\"body\"><h3>Make lines, fill the board<\/h3><p class=\"txt\">Three in a row unlocks a mini prize. All eight stops enter you in the grand prize draw.<\/p><\/div><\/li>\n      <\/ol>\n      <div class=\"how-note\">\n        <span class=\"pill\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16\"/><path d=\"M7 12h10\"/><\/svg>Tap to scan<\/span>\n        <span>In the demo, this button plays the part of the stop crew. Keep tapping to fill the board and see the finale.<\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<section id=\"board\" class=\"board-sec\">\n  <div class=\"wrap\">\n    <div class=\"sec-head center\">\n      <span class=\"kicker\">The nine stops<\/span>\n      <h2>Eight stops and a free square<\/h2>\n      <p class=\"lead\">The board in your passport is the map of the day. Every stop is worth 1 point, and you can play them in any order.<\/p>\n    <\/div>\n    <ol class=\"board\">\n      <li class=\"stop\" style=\"--r:-1.2deg\"><div class=\"top\"><span class=\"num\">1<\/span><svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"30\" r=\"10\"/><circle cx=\"13\" cy=\"27\" r=\"1.4\" fill=\"currentColor\"/><circle cx=\"18\" cy=\"26\" r=\"1.4\" fill=\"currentColor\"/><path d=\"M34 8c-2 0-3 2-3 4 0 3 2 4 2 7s-3 6-3 11 2 10 4 10 4-5 4-10-3-8-3-11 2-4 2-7c0-2-1-4-3-4z\"/><path d=\"M31 18h6\"/><\/svg><\/div><h3>Mini Bowling<\/h3><p class=\"txt\">Six soft pins and a short lane. Little ones can bowl from the front line.<\/p><div class=\"foot\"><span class=\"chip\">1 pt<\/span>Part of 3 lines<\/div><\/li>\n      <li class=\"stop\" style=\"--r:.8deg\"><div class=\"top\"><span class=\"num\">2<\/span><svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 16h8l3-5h14l3 5h8v22H6z\"/><circle cx=\"24\" cy=\"26\" r=\"7\"/><path d=\"M36 21h2\"/><\/svg><\/div><h3>Family Photo Challenge<\/h3><p class=\"txt\">Copy the pose on your challenge card as a team, then show the crew your photo.<\/p><div class=\"foot\"><span class=\"chip\">1 pt<\/span>Part of 2 lines<\/div><\/li>\n      <li class=\"stop\" style=\"--r:1.4deg\"><div class=\"top\"><span class=\"num\">3<\/span><svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 20h32v18H8z\"/><path d=\"M8 20c0-6 4-10 16-10s16 4 16 10\"/><path d=\"M8 26h32\"/><rect x=\"21\" y=\"23\" width=\"6\" height=\"7\" rx=\"1.5\"/><\/svg><\/div><h3>Treasure Hunt<\/h3><p class=\"txt\">Follow the clue map around the grounds and find the hidden chest together.<\/p><div class=\"foot\"><span class=\"chip\">1 pt<\/span>Part of 3 lines<\/div><\/li>\n      <li class=\"stop\" style=\"--r:1deg\"><div class=\"top\"><span class=\"num\">4<\/span><svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 10h32v22H22l-8 7v-7H8z\"/><path d=\"M20 17a4 4 0 1 1 5 4c-1 .4-1 1-1 2.5\"/><circle cx=\"24\" cy=\"27\" r=\".6\" fill=\"currentColor\"/><\/svg><\/div><h3>Family Trivia<\/h3><p class=\"txt\">Quick-fire questions that grown-ups and kids answer as one team.<\/p><div class=\"foot\"><span class=\"chip\">1 pt<\/span>Part of 2 lines<\/div><\/li>\n      <li class=\"stop free\"><div class=\"top\"><svg class=\"star\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2.5l2.9 6.2 6.6.7-5 4.5 1.4 6.6L12 17.2l-5.9 3.3 1.4-6.6-5-4.5 6.6-.7z\" fill=\"#F5B700\"/><\/svg><\/div><h3>Free pass<\/h3><p class=\"txt\">Already stamped when you open your passport. It sits in the middle, so it helps four different lines.<\/p><div class=\"foot\"><span class=\"chip\">Free<\/span>Part of 4 lines<\/div><\/li>\n      <li class=\"stop\" style=\"--r:-1deg\"><div class=\"top\"><span class=\"num\">6<\/span><svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"17\" cy=\"16\" rx=\"7\" ry=\"9\"/><ellipse cx=\"31\" cy=\"16\" rx=\"7\" ry=\"9\"/><ellipse cx=\"24\" cy=\"30\" rx=\"6\" ry=\"7\"/><path d=\"M24 37v6\"/><\/svg><\/div><h3>Balloon Sculpting<\/h3><p class=\"txt\">Watch a dog, a sword or a flower appear, then have a go at twisting one yourself.<\/p><div class=\"foot\"><span class=\"chip\">1 pt<\/span>Part of 2 lines<\/div><\/li>\n      <li class=\"stop\" style=\"--r:1.6deg\"><div class=\"top\"><span class=\"num\">7<\/span><svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M30 6l8 8-14 14-8-8z\"/><path d=\"M16 20l-6 6c-3 3-3 9 1 12 3 3 8 2 10-1l5-5\"/><path d=\"M12 32l4 4\"/><\/svg><\/div><h3>Face Painting<\/h3><p class=\"txt\">Pick a design from the board: tiger, butterfly, superhero and more.<\/p><div class=\"foot\"><span class=\"chip\">1 pt<\/span>Part of 3 lines<\/div><\/li>\n      <li class=\"stop\" style=\"--r:-.8deg\"><div class=\"top\"><span class=\"num\">8<\/span><svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 6l20 10\"/><path d=\"M28 16v10\"/><path d=\"M14 36c0-5 4-8 9-8 4 0 6 2 9 2 3 0 4-2 6-2v6c-2 0-3 4-8 4H18c-2 0-4-1-4-2z\"/><circle cx=\"20\" cy=\"33\" r=\".8\" fill=\"currentColor\"/><path d=\"M6 42h36\"/><\/svg><\/div><h3>Lucky Fishing<\/h3><p class=\"txt\">Hook a floating duck with a magnet rod and see which number it carries.<\/p><div class=\"foot\"><span class=\"chip\">1 pt<\/span>Part of 2 lines<\/div><\/li>\n      <li class=\"stop\" style=\"--r:1.1deg\"><div class=\"top\"><span class=\"num\">9<\/span><svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"22\" cy=\"18\" rx=\"10\" ry=\"12\"/><path d=\"M22 30l-2 3h4z\"/><path d=\"M22 33c0 4 3 5 3 9\"/><path d=\"M34 6l3 4M40 14l-4 1M38 22l-3-2\"/><\/svg><\/div><h3>Pop the Balloon<\/h3><p class=\"txt\">A wall of balloons and a few darts. Pop one to earn your stamp.<\/p><div class=\"foot\"><span class=\"chip\">1 pt<\/span>Part of 3 lines<\/div><\/li>\n    <\/ol>\n    <div class=\"board-key\"><span><i><\/i>Play stop · 1 pt<\/span><span><i class=\"f\"><\/i>Free pass · stamped for you<\/span><span>8 pts fills the board<\/span><\/div>\n  <\/div>\n<\/section>\n\n<div class=\"wrap\">\n  <section id=\"prizes\">\n    <div class=\"sec-head\">\n      <span class=\"kicker\">Prizes<\/span>\n      <h2>Make lines, win prizes<\/h2>\n      <p class=\"lead\">Two ways to win, and they stack. Every line you finish is its own mini prize, and a full board still counts for the draw.<\/p>\n    <\/div>\n    <div class=\"prizes\">\n      <div class=\"card p-lines\">\n        <div>\n          <span class=\"tag\">Mini prize<\/span>\n          <h3>Three in a row<\/h3>\n          <p class=\"txt\">Finish any line of three on your board to unlock a mini prize. There are eight lines to make.<\/p>\n          <ul class=\"lines-list\">\n            <li><b>3<\/b><span>rows across<\/span><\/li>\n            <li><b>3<\/b><span>columns down<\/span><\/li>\n            <li><b>2<\/b><span>diagonals, both through the free pass<\/span><\/li>\n          <\/ul>\n        <\/div>\n        <div class=\"mini-wrap\">\n          <div class=\"mini\" role=\"group\" aria-label=\"Practice board: tap squares to stamp them\">\n            <button class=\"mt\" type=\"button\" aria-pressed=\"false\" data-i=\"0\" aria-label=\"Mini Bowling\">1<\/button>\n            <button class=\"mt\" type=\"button\" aria-pressed=\"false\" data-i=\"1\" aria-label=\"Family Photo Challenge\">2<\/button>\n            <button class=\"mt\" type=\"button\" aria-pressed=\"false\" data-i=\"2\" aria-label=\"Treasure Hunt\">3<\/button>\n            <button class=\"mt\" type=\"button\" aria-pressed=\"false\" data-i=\"3\" aria-label=\"Family Trivia\">4<\/button>\n            <button class=\"mt free\" type=\"button\" aria-pressed=\"true\" aria-disabled=\"true\" data-i=\"4\" aria-label=\"Free pass, always stamped\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2.5l2.9 6.2 6.6.7-5 4.5 1.4 6.6L12 17.2l-5.9 3.3 1.4-6.6-5-4.5 6.6-.7z\" fill=\"#F5B700\"/><\/   var viewer = document.getElementById("viewer"), vif = document.getElementById("vif"), vframe = document.getElementById("vframe"), at = 0, opener = null;
  function open(i) {
    at = (i + SITES.length) % SITES.length; var s = SITES[at];
    opener = document.activeElement;
    document.getElementById("vname").textContent = s.name;
    var live = document.getElementById("vlive"); live.href = s.live; live.hidden = !s.live;
    vif.title = s.name + " website"; vif.srcdoc = s.html;
    viewer.classList.add("open"); document.getElementById("vclose").focus();
  }
  function close() { viewer.classList.remove("open"); vif.srcdoc = ""; if (opener && opener.focus) opener.focus(); }
  document.getElementById("vclose").addEventListener("click", close);
  document.getElementById("vprev").addEventListener("click", function () { open(at - 1); });
  document.getElementById("vnext").addEventListener("click", function () { open(at + 1); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && viewer.classList.contains("open")) close(); });
  document.querySelectorAll("[data-dev]").forEach(function (b) {
    b.addEventListener("click", function () {
      vframe.classList.toggle("mobile", b.getAttribute("data-dev") === "mobile");
      document.querySelectorAll("[data-dev]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    });
  });
})();
</script>
</body>
</html>

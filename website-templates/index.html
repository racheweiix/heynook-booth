<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Templates</title>
<meta name="description" content="Booth 03, Creator's Hub: event website templates built with FlowAI, each paired with its EventNook digital passport. Spin the ring and open any site to explore it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: a planetarium for websites. Live site pages float on a slowly turning 3D ring over a deep ink floor;
   each one scrolls itself like a phone home screen. A toggle flattens the ring into a grid; any page opens full screen. */
:root {
  color-scheme: dark;
  --ink: #1E0E62;          /* EventNook ink */
  --night: #0B0630;
  --nook: #00B0F0;         /* Nook Blue */
  --text: #F3F1FF;
  --mute: #A9A3D6;
  --line: rgba(255,255,255,.14);
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--text); font: 400 16px/1.55 var(--font); overflow-x: hidden;
  background: radial-gradient(1100px 620px at 50% 108%, rgba(0,176,240,.28), transparent 62%),
              radial-gradient(900px 500px at 50% -20%, rgba(124,92,255,.25), transparent 60%), var(--night); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--nook); outline-offset: 3px; }

.top { position: relative; z-index: 3; max-width: 1200px; margin: 0 auto; padding: 28px 16px 0; display: grid; gap: 18px; }
.row { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px; }
.kicker { font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--nook); }
h1 { margin: 8px 0 0; font-size: clamp(34px, 5.4vw, 64px); line-height: 1.02; letter-spacing: -.03em; font-weight: 700; text-wrap: balance; }
.lede { margin: 12px 0 0; max-width: 52ch; color: var(--mute); font-size: 18px; }
.toggle { display: inline-flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
.toggle button { border: 0; background: none; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--mute); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--text); color: var(--ink); }

/* ring */
.stage { position: relative; height: min(80vh, 820px); min-height: 600px; perspective: 1800px; perspective-origin: 50% 30%; overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; }
.stage.dragging { cursor: grabbing; }
.ring { position: absolute; left: 50%; top: 44%; width: 0; height: 0; transform-style: preserve-3d; }
.panel { position: absolute; left: calc(var(--w) / -2); top: calc(var(--h) / -2); width: var(--w); height: var(--h);
  transform-style: preserve-3d; cursor: pointer; border: 0; padding: 0; background: none; }
.page { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; background: #fff;
  box-shadow: 0 30px 70px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.12); backface-visibility: hidden; }
.panel .lid { position: absolute; inset: 0; border-radius: 18px; padding: 6px; backface-visibility: hidden;
  background: linear-gradient(140deg, rgba(255,255,255,.22), rgba(255,255,255,.04) 45%, rgba(0,176,240,.10));
  border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 40px 90px -30px rgba(0,0,0,.8), 0 0 40px -10px rgba(0,176,240,.35), inset 0 1px 0 rgba(255,255,255,.35); }
.panel .lid .page { inset: 6px; border-radius: 12px; box-shadow: none; }
.panel .lid::after { content: ""; position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 70%, rgba(255,255,255,.10) 100%); mix-blend-mode: screen; }
.page iframe { position: absolute; left: 0; top: 0; width: 1280px; border: 0; transform-origin: 0 0; pointer-events: none; }
.page::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 70%, rgba(11,6,48,.35)); pointer-events: none; }
.reflect { position: absolute; left: 0; right: 0; top: 100%; height: 40%; margin-top: 14px; border-radius: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.10), transparent); filter: blur(6px); opacity: .5; backface-visibility: hidden; }
.label { position: absolute; z-index: 3; left: 50%; bottom: 56px; transform: translateX(-50%); text-align: center; display: grid; gap: 4px; pointer-events: none; width: min(560px, calc(100% - 32px)); }
.label b { font-size: 22px; letter-spacing: -.01em; }
.label span { color: var(--mute); font-size: 15px; }
.hint { position: absolute; z-index: 3; right: 16px; top: 12px; font-size: 13px; color: var(--mute); }
.navs { position: absolute; z-index: 3; left: 0; right: 0; top: 44%; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; }
.navs button { pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: rgba(11,6,48,.6); cursor: pointer; font-size: 20px; }

/* grid */
.grid { display: none; max-width: 1200px; margin: 28px auto 64px; padding: 0 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
.grid .card { display: grid; gap: 12px; text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 26px; padding: 14px; cursor: pointer; }
.grid .card .page { position: relative; inset: auto; height: auto; aspect-ratio: 16 / 10; border-radius: 12px; }
.grid .card b { font-size: 18px; padding: 0 6px; }
.grid .card span { color: var(--mute); font-size: 14px; padding: 0 6px 6px; }
body.is-grid .grid { display: grid; }
body.is-grid .stage { display: none; }

/* viewer */
.viewer { position: fixed; inset: 0; z-index: 20; background: rgba(6,3,28,.92); display: none; flex-direction: column; }
.viewer.open { display: flex; }
.vbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.vbar b { font-size: 17px; margin-right: auto; }
.vbtn { border: 1px solid var(--line); background: rgba(255,255,255,.06); border-radius: 999px; min-height: 40px; padding: 0 16px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.vbtn.primary { background: var(--nook); border-color: transparent; color: #04122B; }
.vbtn[aria-pressed="true"] { background: var(--text); color: var(--ink); }
.vframe { flex: 1; display: flex; justify-content: center; padding: 16px; min-height: 0; }
.vframe iframe { width: 100%; max-width: 1440px; height: 100%; border: 0; border-radius: 16px; background: #fff; box-shadow: 0 30px 80px -30px rgba(0,0,0,.8); transition: max-width .3s ease-out; }
.vframe.mobile iframe { max-width: 390px; border-radius: 30px; }
@media (max-width: 640px) { .stage { min-height: 520px; } .label b { font-size: 18px; } .hint { display: none; } }
@media (prefers-reduced-motion: reduce) { .vframe iframe { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div>
      <span class="kicker">Booth 03 · Creator's Hub</span>
      <h1>Website templates</h1>
      <p class="lede">Event websites built with FlowAI, each with its own digital passport embedded live. Spin the ring, then open a template to explore it.</p>
    </div>
    <div class="toggle" role="group" aria-label="View">
      <button type="button" data-view="ring" aria-pressed="true">Ring</button>
      <button type="button" data-view="grid" aria-pressed="false">Grid</button>
    </div>
  </div>
</header>

<main>
  <div class="stage" id="stage" aria-label="Rotating ring of website templates. Drag, scroll or use the arrows to spin; press Enter to open the front site.">
    <span class="hint">Drag or scroll to spin · click to open</span>
    <div class="ring" id="ring"></div>
    <div class="navs"><button type="button" id="prev" aria-label="Previous site">←</button><button type="button" id="next" aria-label="Next site">→</button></div>
    <div class="label" aria-live="polite"><b id="lname"></b><span id="ltag"></span></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vname">
  <div class="vbar">
    <b id="vname"></b>
    <div class="toggle" role="group" aria-label="Device">
      <button type="button" data-dev="desktop" aria-pressed="true">Desktop</button>
      <button type="button" data-dev="mobile" aria-pressed="false">Mobile</button>
    </div>
    <button type="button" class="vbtn" id="vprev" aria-label="Previous site">←</button>
    <button type="button" class="vbtn" id="vnext" aria-label="Next site">→</button>
    <a class="vbtn primary" id="vlive" target="_blank" rel="noopener">Open live site ↗</a>
    <button type="button" class="vbtn" id="vclose">Close</button>
  </div>
  <div class="vframe" id="vframe"><iframe id="vif" title="Website template"></iframe></div>
</div>

<script>
var SITES = [{"name": "NextGen HR Summit", "tag": "Calm learning journey · points and rewards passport", "live": "https://nextgen-hr-summit.eventnook.site/", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>NextGen HR Summit<\/title>\n<meta name=\"description\" content=\"A one-day summit for HR teams putting AI, employee experience and people analytics to work. Collect points on your digital passport as you go.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Layout: a calm learning path. The hero's dotted trail runs down the page; each section is one step on it. */\n:root {\n  color-scheme: light;\n  --paper: #F7EFEA;      /* the passport's warm blush ground */\n  --card: #FFFFFF;\n  --ink: #1F2A33;\n  --mute: #5A6670;\n  --green: #2F7D62;      /* NG badge green */\n  --green-soft: #E3F1EA;\n  --blue-soft: #E7EEF8;\n  --gold: #C9962B;\n  --gold-soft: #FBF1D9;\n  --line: #E6DDD6;\n  --display: \"Young Serif\", Georgia, serif;\n  --body: \"Figtree\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --r: 22px;\n}\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.6 var(--body); padding-inline: 16px; }\na { color: inherit; }\nimg, svg, iframe { max-width: 100%; }\n.wrap { max-width: 1120px; margin: 0 auto; }\nh1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.12; text-wrap: balance; margin: 0; }\nh2 { font-size: clamp(30px, 4.4vw, 46px); }\nh3 { font-size: 22px; }\n.kicker { font: 700 13px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--green); }\n.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; font: 700 16px/1 var(--body); text-decoration: none; border: 2px solid transparent; transition: transform .15s ease-out, background .15s; }\n.btn:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }\n.btn-primary { background: var(--green); color: #fff; }\n.btn-primary:hover { transform: translateY(-1px); background: #276a53; }\n.btn-ghost { border-color: var(--ink); color: var(--ink); }\n.btn-ghost:hover { background: rgba(31,42,51,.06); }\n\n/* nav */\n.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; }\n.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; }\n.badge { width: 38px; height: 38px; border-radius: 10px; background: var(--green); color: #fff; display: grid; place-items: center; font: 700 14px/1 var(--body); }\n.nav ul { display: flex; gap: 24px; list-style: none; margin: 0; padding: 0; font-weight: 600; font-size: 15px; }\n.nav ul a { text-decoration: none; color: var(--mute); }\n.nav ul a:hover { color: var(--ink); }\n@media (max-width: 760px) { .nav ul { display: none; } }\n\n/* hero */\n.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; padding-block: 40px 72px; }\n.hero h1 { font-size: clamp(44px, 7vw, 84px); margin-top: 18px; }\n.hero h1 em { font-style: normal; color: var(--green); }\n.hero p.lede { font-size: 20px; color: var(--mute); max-width: 34ch; margin: 22px 0 0; }\n.facts { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 30px; padding: 0; list-style: none; }\n.facts li { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 15px; }\n.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }\n.hero-art { position: relative; aspect-ratio: 1 / 1; border-radius: 36px; background: linear-gradient(160deg, #EAF4EE, #EEF2FA 60%, #FCF4E2); overflow: hidden; }\n.hero-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }\n.hero-art .tag { position: absolute; left: 24px; bottom: 24px; right: 24px; background: rgba(255,255,255,.9); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; font-weight: 600; font-size: 15px; }\n.hero-art .tag b { white-space: nowrap; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--green); }\n@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 32px; padding-block: 16px 48px; } .hero-art { max-width: 460px; } }\n\nsection { padding-block: 72px; }\n.sec-head { display: grid; gap: 12px; max-width: 640px; margin-bottom: 36px; }\n.sec-head p { color: var(--mute); margin: 0; font-size: 18px; }\n\n/* passport */\n.passport { display: grid; grid-template-columns: 1fr 380px; gap: 56px; align-items: start; }\n.steps { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 14px; }\n.steps li { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; background: var(--card); border-radius: 18px; padding: 16px 18px; border: 1px solid var(--line); }\n.steps .n { width: 44px; height: 44px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font: 400 20px/1 var(--display); }\n.steps b { display: block; font-size: 17px; }\n.steps span { color: var(--mute); font-size: 15px; }\n.phone { position: sticky; top: 24px; border-radius: 44px; background: #1F2A33; padding: 12px; box-shadow: 0 30px 60px -25px rgba(31,42,51,.45); }\n.phone iframe { display: block; width: 100%; height: 700px; border: 0; border-radius: 34px; background: #fff; }\n.phone-cap { text-align: center; font-size: 14px; color: var(--mute); margin-top: 14px; }\n.phone-cap a { font-weight: 700; color: var(--green); }\n@media (max-width: 900px) { .passport { grid-template-columns: 1fr; } .phone { position: static; max-width: 380px; margin: 0 auto; } .phone iframe { height: 620px; } }\n\n/* rewards */\n.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }\n.tier { background: var(--card); border-radius: var(--r); padding: 26px; border: 1px solid var(--line); display: grid; gap: 6px; }\n.tier .pts { font: 400 44px/1 var(--display); }\n.tier .pts small { font: 600 15px/1 var(--body); color: var(--mute); margin-left: 4px; }\n.tier .name { font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }\n.tier .gift { font-size: 18px; font-weight: 600; margin-top: 8px; }\n.tier.bronze .name { color: #A0673A; } .tier.bronze { background: #FBF3EC; }\n.tier.silver .name { color: #6B7785; } .tier.silver { background: #F2F4F7; }\n.tier.gold .name { color: var(--gold); } .tier.gold { background: var(--gold-soft); }\n.meter { margin-top: 22px; background: var(--card); border-radius: 999px; height: 14px; position: relative; border: 1px solid var(--line); }\n.meter i { position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--green); transform: translate(-50%, -50%); }\n.meter-labels { display: flex; justify-content: space-between; font-size: 14px; color: var(--mute); margin-top: 10px; font-variant-numeric: tabular-nums; }\n@media (max-width: 760px) { .tiers { grid-template-columns: 1fr; } }\n\n/* programme */\n.prog { display: grid; gap: 16px; }\n.block { background: var(--card); border-radius: var(--r); border: 1px solid var(--line); display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }\n.block .side { padding: 24px; display: grid; align-content: start; gap: 8px; }\n.block .side .avail { font-weight: 700; font-size: 14px; }\n.block .side p { margin: 0; color: var(--mute); font-size: 15px; }\n.block ul { list-style: none; margin: 0; padding: 12px; display: grid; gap: 8px; align-content: start; }\n.block li { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 14px 16px; border-radius: 14px; background: #FBF8F5; }\n.block li span:first-child { font-weight: 600; }\n.chip { flex: none; font-weight: 700; font-size: 14px; padding: 5px 12px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-variant-numeric: tabular-nums; }\n.b-key .side { background: var(--blue-soft); }\n.b-work .side { background: var(--green-soft); }\n.b-booth .side { background: var(--gold-soft); }\n.b-net .side { background: #EEF2FA; }\n.b-fb .side { background: #FBEDE6; }\n@media (max-width: 760px) { .block { grid-template-columns: 1fr; } }\n\n/* faq */\n.faq { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }\n.faq div { background: var(--card); border-radius: 18px; padding: 22px; border: 1px solid var(--line); }\n.faq h3 { font-size: 19px; margin-bottom: 8px; }\n.faq p { margin: 0; color: var(--mute); font-size: 16px; }\n@media (max-width: 760px) { .faq { grid-template-columns: 1fr; } }\n\n.closing { background: var(--green); color: #fff; border-radius: 36px; padding: 56px 40px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; margin-block: 24px 48px; }\n.closing h2 { color: #fff; }\n.closing p { margin: 10px 0 0; opacity: .85; font-size: 18px; }\n.closing .btn { background: #fff; color: var(--green); }\n@media (max-width: 760px) { .closing { grid-template-columns: 1fr; padding: 40px 24px; } }\nfooter { padding-block: 24px 40px; color: var(--mute); font-size: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }\nfooter b { color: var(--ink); }\n@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn { transition: none; } }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <nav class=\"nav\" aria-label=\"Main\">\n    <a class=\"brand\" href=\"#top\"><span class=\"badge\">NG<\/span> NextGen HR Summit<\/a>\n    <ul>\n      <li><a href=\"#passport\">Passport<\/a><\/li>\n      <li><a href=\"#rewards\">Rewards<\/a><\/li>\n      <li><a href=\"#programme\">Programme<\/a><\/li>\n      <li><a href=\"#faq\">FAQ<\/a><\/li>\n    <\/ul>\n    <a class=\"btn btn-primary\" href=\"#passport\">Get your passport<\/a>\n  <\/nav>\n\n  <header class=\"hero\" id=\"top\">\n    <div>\n      <span class=\"kicker\">NextGen HR Summit<\/span>\n      <h1>Your <em>learning journey<\/em> starts here<\/h1>\n      <p class=\"lede\">A one-day summit for HR teams putting AI, employee experience and people analytics to work. Learn, connect and collect points as you go.<\/p>\n      <ul class=\"facts\">\n        <li>9 activities<\/li>\n        <li>150 points to collect<\/li>\n        <li>3 rewards<\/li>\n      <\/ul>\n      <div class=\"cta-row\">\n        <a class=\"btn btn-primary\" href=\"#passport\">See how the passport works<\/a>\n        <a class=\"btn btn-ghost\" href=\"#programme\">View the programme<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"hero-art\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 400 400\">\n        <path d=\"M40 330 C 110 300, 90 230, 170 220 S 270 170, 250 110 S 320 50, 360 60\" fill=\"none\" stroke=\"#2F7D62\" stroke-width=\"4\" stroke-dasharray=\"2 12\" stroke-linecap=\"round\"/>\n        <circle cx=\"40\" cy=\"330\" r=\"9\" fill=\"#C9962B\"/>\n        <circle cx=\"360\" cy=\"60\" r=\"12\" fill=\"#F2D27A\"/>\n        <circle cx=\"300\" cy=\"90\" r=\"46\" fill=\"#FBEFC8\"/>\n        <circle cx=\"120\" cy=\"150\" r=\"54\" fill=\"#DCEDE4\"/>\n        <g transform=\"translate(170 150) rotate(-8)\">\n          <rect x=\"0\" y=\"0\" width=\"92\" height=\"120\" rx=\"12\" fill=\"#2F7D62\"/>\n          <rect x=\"8\" y=\"8\" width=\"76\" height=\"104\" rx=\"8\" fill=\"none\" stroke=\"#F2D27A\" stroke-width=\"2\" opacity=\".7\"/>\n          <circle cx=\"46\" cy=\"54\" r=\"20\" fill=\"none\" stroke=\"#F2D27A\" stroke-width=\"3\"/>\n          <path d=\"M26 54 h40 M46 34 c-10 12 -10 28 0 40 M46 34 c10 12 10 28 0 40\" fill=\"none\" stroke=\"#F2D27A\" stroke-width=\"2\"/>\n          <rect x=\"26\" y=\"88\" width=\"40\" height=\"5\" rx=\"2.5\" fill=\"#F2D27A\"/>\n        <\/g>\n        <path d=\"M318 168 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z\" fill=\"#C9962B\"/>\n        <path d=\"M86 268 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z\" fill=\"#2F7D62\"/>\n      <\/svg>\n      <div class=\"tag\"><b>0 → 150<\/b> points across keynotes, workshops, booths and more<\/div>\n    <\/div>\n  <\/header>\n<\/div>\n\n<div class=\"wrap\">\n  <section id=\"passport\" class=\"passport\">\n    <div>\n      <div class=\"sec-head\">\n        <span class=\"kicker\">Your digital passport<\/span>\n        <h2>One QR code. Every activity counts.<\/h2>\n        <p>Every attendee gets a digital passport in their confirmation email. No app to download.<\/p>\n      <\/div>\n      <ol class=\"steps\">\n        <li><span class=\"n\">1<\/span><div><b>Open your passport<\/b><span>It shows your name, your check-in QR and your points so far.<\/span><\/div><\/li>\n        <li><span class=\"n\">2<\/span><div><b>Show your QR at each activity<\/b><span>The team scans you in at the keynote, each workshop, every sponsor booth and the networking lounge.<\/span><\/div><\/li>\n        <li><span class=\"n\">3<\/span><div><b>Watch your points add up<\/b><span>Points land after your QR is verified. Each activity earns points once.<\/span><\/div><\/li>\n        <li><span class=\"n\">4<\/span><div><b>Unlock your rewards<\/b><span>Reach 50, 100 and 150 points for a swag bag, a coffee voucher and a lucky draw entry.<\/span><\/div><\/li>\n      <\/ol>\n    <\/div>\n    <div>\n      <div class=\"phone\">\n        <iframe title=\"NextGen HR Summit digital passport, live\" loading=\"lazy\"\n          src=\"https://reg.eventnook.com/myorder/mysessions/eid_M7cwNDLWdXU1MDUEAA/12779641LLBT?uid=a78123b2ad4c074d244f52b6cef43f19bd543c\"><\/iframe>\n      <\/div>\n      <p class=\"phone-cap\">A live sample passport. Scroll inside it, or <a href=\"https://reg.eventnook.com/myorder/mysessions/eid_M7cwNDLWdXU1MDUEAA/12779641LLBT?uid=a78123b2ad4c074d244f52b6cef43f19bd543c\" target=\"_blank\" rel=\"noopener\">open it full screen<\/a>.<\/p>\n    <\/div>\n  <\/section>\n\n  <section id=\"rewards\">\n    <div class=\"sec-head\">\n      <span class=\"kicker\">Rewards<\/span>\n      <h2>Rewards stack. Points are never spent.<\/h2>\n      <p>Reaching a new tier keeps everything you've already unlocked.<\/p>\n    <\/div>\n    <div class=\"tiers\">\n      <div class=\"tier bronze\"><span class=\"name\">Bronze<\/span><span class=\"pts\">50<small>pts<\/small><\/span><span class=\"gift\">Swag bag<\/span><\/div>\n      <div class=\"tier silver\"><span class=\"name\">Silver<\/span><span class=\"pts\">100<small>pts<\/small><\/span><span class=\"gift\">Coffee voucher<\/span><\/div>\n      <div class=\"tier gold\"><span class=\"name\">Gold<\/span><span class=\"pts\">150<small>pts<\/small><\/span><span class=\"gift\">Lucky draw entry<\/span><\/div>\n    <\/div>\n    <div class=\"meter\" role=\"img\" aria-label=\"Points scale from 0 to 150 with tiers at 50, 100 and 150\">\n      <i style=\"left:33.3%\"><\/i><i style=\"left:66.6%\"><\/i><i style=\"left:100%\"><\/i>\n    <\/div>\n    <div class=\"meter-labels\"><span>0<\/span><span>50<\/span><span>100<\/span><span>150<\/span><\/div>\n  <\/section>\n\n  <section id=\"programme\">\n    <div class=\"sec-head\">\n      <span class=\"kicker\">Programme<\/span>\n      <h2>Nine activities, five ways to earn<\/h2>\n      <p>Every activity below is a stop on your passport. Here's what each one is worth.<\/p>\n    <\/div>\n    <div class=\"prog\">\n      <article class=\"block b-key\">\n        <div class=\"side\"><h3>Keynote<\/h3><p>Kick off the summit at the opening keynote.<\/p><span class=\"avail\">20 pts available<\/span><\/div>\n        <ul><li><span>Opening Keynote<\/span><span class=\"chip\">20 pts<\/span><\/li><\/ul>\n      <\/article>\n      <article class=\"block b-work\">\n        <div class=\"side\"><h3>Workshops<\/h3><p>Hands-on sessions to sharpen your people practice.<\/p><span class=\"avail\">60 pts available<\/span><\/div>\n        <ul>\n          <li><span>AI in HR: From Ideas to Everyday Impact<\/span><span class=\"chip\">20 pts<\/span><\/li>\n          <li><span>Designing an Employee Experience That Matters<\/span><span class=\"chip\">20 pts<\/span><\/li>\n          <li><span>People Analytics: Turning Data into Decisions<\/span><span class=\"chip\">20 pts<\/span><\/li>\n        <\/ul>\n      <\/article>\n      <article class=\"block b-booth\">\n        <div class=\"side\"><h3>Sponsor Booths<\/h3><p>Meet our sponsors and get your QR scanned at each booth.<\/p><span class=\"avail\">30 pts available<\/span><\/div>\n        <ul>\n          <li><span>Sponsor Booth A<\/span><span class=\"chip\">10 pts<\/span><\/li>\n          <li><span>Sponsor Booth B<\/span><span class=\"chip\">10 pts<\/span><\/li>\n          <li><span>Sponsor Booth C<\/span><span class=\"chip\">10 pts<\/span><\/li>\n        <\/ul>\n      <\/article>\n      <article class=\"block b-net\">\n        <div class=\"side\"><h3>Networking Lounge<\/h3><p>Drop by, meet peers and scan in at the lounge.<\/p><span class=\"avail\">10 pts available<\/span><\/div>\n        <ul><li><span>Networking Lounge<\/span><span class=\"chip\">10 pts<\/span><\/li><\/ul>\n      <\/article>\n      <article class=\"block b-fb\">\n        <div class=\"side\"><h3>Session Feedback<\/h3><p>Tell us how today's sessions went.<\/p><span class=\"avail\">30 pts available<\/span><\/div>\n        <ul><li><span>Session Feedback<\/span><span class=\"chip\">30 pts<\/span><\/li><\/ul>\n      <\/article>\n    <\/div>\n  <\/section>\n\n  <section id=\"faq\">\n    <div class=\"sec-head\">\n      <span class=\"kicker\">Good to know<\/span>\n      <h2>Questions, answered<\/h2>\n    <\/div>\n    <div class=\"faq\">\n      <div><h3>Do I need to download an app?<\/h3><p>No. Your passport opens in the browser from the link in your confirmation email.<\/p><\/div>\n      <div><h3>When do my points appear?<\/h3><p>As soon as the team verifies your QR at an activity. Feedback points land once your response is submitted.<\/p><\/div>\n      <div><h3>Can I earn points twice?<\/h3><p>No. Each activity earns points once, so the best way up is to try everything.<\/p><\/div>\n      <div><h3>Where do I collect my rewards?<\/h3><p>Show your passport at the rewards desk once you reach a tier.<\/p><\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"closing\">\n    <div>\n      <h2>Ready to start your journey?<\/h2>\n      <p>Open the sample passport and see what attendees see on the day.<\/p>\n    <\/div>\n    <a class=\"btn\" href=\"https://reg.eventnook.com/myorder/mysessions/eid_M7cwNDLWdXU1MDUEAA/12779641LLBT?uid=a78123b2ad4c074d244f52b6cef43f19bd543c\" target=\"_blank\" rel=\"noopener\">Open the passport<\/a>\n  <\/div>\n\n  <footer><span>NextGen HR Summit · a sample event for showcase<\/span><span>Powered by <b>eventnook<\/b><\/span><\/footer>\n<\/div>\n<\/body>\n<\/html>\n"}, {"name": "The Singapore Tech Experience", "tag": "Night-sky mission · seven-stamp passport", "live": "https://sg-tech-experience.eventnook.site/", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>The Singapore Tech Experience<\/title>\n<meta name=\"description\" content=\"Seven zones of hands-on tech, from AI to cyber security. Explore each one, collect every stamp on your digital passport and unlock your lucky draw entry.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Michroma&family=Manrope:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Layout: a mission through deep space. The page is one night sky; each zone is a glowing card on the route. Single dark theme on purpose. */\n:root {\n  color-scheme: dark;\n  --space: #0E1030;\n  --space-2: #161A44;\n  --card: rgba(30, 34, 82, .72);\n  --edge: rgba(150, 140, 255, .28);\n  --glow: #8B7CF6;\n  --glow-2: #5EC8F2;\n  --ink: #F1F0FF;\n  --mute: #A9A8D6;\n  --done: #B9AEFF;\n  --display: \"Michroma\", \"Eurostile\", \"Arial Black\", sans-serif;\n  --body: \"Manrope\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; background: var(--space); }\nbody { margin: 0; color: var(--ink); font: 400 17px/1.6 var(--body); padding-inline: 16px;\n  background:\n    radial-gradient(1200px 600px at 80% -10%, rgba(139,124,246,.28), transparent 60%),\n    radial-gradient(900px 500px at -10% 40%, rgba(94,200,242,.14), transparent 60%),\n    var(--space); }\n.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }\n.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; }\na { color: inherit; }\niframe, svg { max-width: 100%; }\nh1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: .01em; }\nh2 { font-size: clamp(24px, 3.4vw, 36px); }\nh3 { font-size: 17px; }\n.pill { justify-self: start; display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--edge); background: rgba(22,26,68,.8); font: 400 13px/1 var(--display); letter-spacing: .04em; }\n.pill::before { content: \"\"; width: 8px; height: 8px; transform: rotate(45deg); background: var(--glow); box-shadow: 0 0 10px var(--glow); }\n.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 50px; padding: 0 24px; border-radius: 14px; font: 700 16px/1 var(--body); text-decoration: none; border: 1px solid var(--edge); transition: transform .15s ease-out, box-shadow .15s; }\n.btn:focus-visible, a:focus-visible { outline: 2px solid var(--glow-2); outline-offset: 3px; }\n.btn-primary { background: linear-gradient(135deg, #7C6CF2, #5B8CF2); border-color: transparent; color: #fff; box-shadow: 0 10px 30px -10px rgba(124,108,242,.8); }\n.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 34px -10px rgba(124,108,242,.95); }\n.btn-ghost { background: rgba(22,26,68,.6); color: var(--ink); }\n.btn-ghost:hover { border-color: var(--glow); }\n\n.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; }\n.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font: 400 14px/1.2 var(--display); }\n.logo { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--edge); background: var(--space-2); display: grid; place-items: center; }\n.nav ul { display: flex; gap: 26px; list-style: none; margin: 0; padding: 0; font-weight: 600; font-size: 15px; }\n.nav ul a { text-decoration: none; color: var(--mute); }\n.nav ul a:hover { color: var(--ink); }\n@media (max-width: 760px) { .nav ul { display: none; } .nav .btn { display: none; } }\n\n.hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; padding-block: 48px 80px; }\n.hero h1 { font-size: clamp(32px, 5.2vw, 60px); margin-top: 22px; }\n.hero h1 span { background: linear-gradient(90deg, #C9C1FF, #7FD7F7); -webkit-background-clip: text; background-clip: text; color: transparent; }\n.lede { font-size: 20px; color: var(--mute); max-width: 36ch; margin: 22px 0 30px; }\n.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }\n.stats { display: flex; gap: 32px; margin-top: 40px; flex-wrap: wrap; }\n.stats div { display: grid; gap: 4px; }\n.stats b { font: 400 30px/1 var(--display); }\n.stats span { color: var(--mute); font-size: 14px; }\n.orbit { position: relative; aspect-ratio: 1; }\n.orbit svg { width: 100%; height: 100%; }\n@media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-block: 16px 56px; } .orbit { max-width: 360px; margin: 0 auto; } }\n\nsection { padding-block: 72px; }\n.sec-head { display: grid; gap: 16px; max-width: 660px; margin-bottom: 36px; }\n.sec-head p { margin: 0; color: var(--mute); font-size: 18px; }\n\n/* zones */\n.zones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }\n.zone { position: relative; background: var(--card); border: 1px solid var(--edge); border-radius: 22px; padding: 24px; display: grid; gap: 12px; align-content: start; backdrop-filter: blur(6px); }\n.zone .ic { width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--edge); background: rgba(14,16,48,.8); display: grid; place-items: center; color: var(--done); box-shadow: inset 0 0 18px rgba(139,124,246,.2); }\n.zone .ic svg { width: 26px; height: 26px; }\n.zone p { margin: 0; color: var(--mute); font-size: 15px; }\n.zone .num { position: absolute; top: 22px; right: 22px; font: 400 12px/1 var(--display); color: var(--mute); }\n.zone.reward { grid-column: span 2; background: linear-gradient(135deg, rgba(124,108,242,.35), rgba(91,140,242,.18)); border-color: rgba(185,174,255,.5); grid-template-columns: auto 1fr; align-items: center; gap: 20px; }\n@media (max-width: 900px) { .zones { grid-template-columns: repeat(2, 1fr); } .zone.reward { grid-column: span 2; } }\n@media (max-width: 560px) { .zones { grid-template-columns: 1fr; } .zone.reward { grid-column: auto; grid-template-columns: 1fr; } }\n\n/* passport */\n.passport { display: grid; grid-template-columns: 1fr 390px; gap: 56px; align-items: start; }\n.route { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }\n.route li { display: grid; grid-template-columns: 40px 1fr; gap: 16px; position: relative; padding-bottom: 28px; }\n.route li::before { content: \"\"; position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: linear-gradient(var(--glow), transparent); }\n.route li:last-child::before { display: none; }\n.route .dot { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--edge); background: var(--space-2); display: grid; place-items: center; font: 400 13px/1 var(--display); color: var(--done); box-shadow: 0 0 16px rgba(139,124,246,.35); }\n.route b { display: block; font-size: 18px; margin-bottom: 2px; }\n.route span { color: var(--mute); font-size: 16px; }\n.phone { position: sticky; top: 24px; border-radius: 44px; padding: 12px; background: #05061A; border: 1px solid var(--edge); box-shadow: 0 0 60px -10px rgba(139,124,246,.55); }\n.phone iframe { display: block; width: 100%; height: 720px; border: 0; border-radius: 34px; background: var(--space); }\n.phone-cap { text-align: center; color: var(--mute); font-size: 14px; margin-top: 14px; }\n.phone-cap a { color: var(--done); font-weight: 700; }\n@media (max-width: 900px) { .passport { grid-template-columns: 1fr; } .phone { position: static; max-width: 390px; margin: 0 auto; } .phone iframe { height: 640px; } }\n\n.faq { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }\n.faq div { background: var(--card); border: 1px solid var(--edge); border-radius: 20px; padding: 22px; }\n.faq h3 { margin-bottom: 10px; font-size: 15px; }\n.faq p { margin: 0; color: var(--mute); }\n@media (max-width: 760px) { .faq { grid-template-columns: 1fr; } }\n\n.launch { margin-block: 24px 48px; border-radius: 32px; padding: 52px 40px; border: 1px solid rgba(185,174,255,.45); background: radial-gradient(600px 300px at 90% 0%, rgba(94,200,242,.25), transparent 70%), linear-gradient(135deg, #2A2370, #1A1D52); display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }\n.launch p { margin: 12px 0 0; color: var(--mute); font-size: 18px; }\n@media (max-width: 760px) { .launch { grid-template-columns: 1fr; padding: 40px 24px; } }\nfooter { padding-block: 24px 40px; color: var(--mute); font-size: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }\nfooter b { color: var(--ink); }\n.twinkle { animation: tw 3.2s ease-in-out infinite; }\n@keyframes tw { 50% { opacity: .35; } }\n@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .twinkle { animation: none; } .btn { transition: none; } }\n<\/style>\n<\/head>\n<body>\n<svg class=\"sky\" aria-hidden=\"true\" preserveAspectRatio=\"none\" viewBox=\"0 0 1000 1000\" id=\"sky\"><\/svg>\n<div class=\"wrap\">\n  <nav class=\"nav\" aria-label=\"Main\">\n    <a class=\"brand\" href=\"#top\"><span class=\"logo\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B9AEFF\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M15.5 8.5c-1-1.2-2.3-1.7-3.6-1.7-1.9 0-3.3 1-3.3 2.6 0 3.4 7.1 1.9 7.1 5.4 0 1.7-1.6 2.7-3.6 2.7-1.6 0-3-.7-3.8-1.9\"/><\/svg><\/span>The Singapore<br>Tech Experience<\/a>\n    <ul>\n      <li><a href=\"#zones\">Zones<\/a><\/li>\n      <li><a href=\"#passport\">Passport<\/a><\/li>\n      <li><a href=\"#faq\">FAQ<\/a><\/li>\n    <\/ul>\n    <a class=\"btn btn-ghost\" href=\"#passport\">Your tech passport<\/a>\n  <\/nav>\n\n  <header class=\"hero\" id=\"top\">\n    <div>\n      <span class=\"pill\">Explore · Connect · Complete<\/span>\n      <h1>The Singapore <span>Tech Experience<\/span><\/h1>\n      <p class=\"lede\">Seven zones of hands-on tech, from AI to cyber security. Explore each one, collect every stamp and unlock your reward.<\/p>\n      <div class=\"cta-row\">\n        <a class=\"btn btn-primary\" href=\"#passport\">Start your tech journey<\/a>\n        <a class=\"btn btn-ghost\" href=\"#zones\">Explore the zones<\/a>\n      <\/div>\n      <div class=\"stats\">\n        <div><b>7<\/b><span>activities<\/span><\/div>\n        <div><b>1<\/b><span>QR pass<\/span><\/div>\n        <div><b>1<\/b><span>lucky draw entry<\/span><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"orbit\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 400 400\">\n        <defs>\n          <radialGradient id=\"moon\" cx=\"40%\" cy=\"35%\"><stop offset=\"0\" stop-color=\"#F3F1FF\"/><stop offset=\"1\" stop-color=\"#A9A3D9\"/><\/radialGradient>\n          <linearGradient id=\"ring\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#8B7CF6\" stop-opacity=\".9\"/><stop offset=\"1\" stop-color=\"#5EC8F2\" stop-opacity=\".2\"/><\/linearGradient>\n        <\/defs>\n        <ellipse cx=\"200\" cy=\"210\" rx=\"180\" ry=\"70\" fill=\"none\" stroke=\"url(#ring)\" stroke-width=\"2\" transform=\"rotate(-18 200 210)\"/>\n        <ellipse cx=\"200\" cy=\"210\" rx=\"130\" ry=\"46\" fill=\"none\" stroke=\"#8B7CF6\" stroke-opacity=\".3\" stroke-dasharray=\"3 9\" transform=\"rotate(-18 200 210)\"/>\n        <circle cx=\"200\" cy=\"200\" r=\"86\" fill=\"url(#moon)\"/>\n        <circle cx=\"172\" cy=\"176\" r=\"14\" fill=\"#9C96CC\" opacity=\".55\"/>\n        <circle cx=\"228\" cy=\"226\" r=\"20\" fill=\"#9C96CC\" opacity=\".45\"/>\n        <circle cx=\"222\" cy=\"168\" r=\"7\" fill=\"#9C96CC\" opacity=\".6\"/>\n        <circle cx=\"168\" cy=\"236\" r=\"9\" fill=\"#9C96CC\" opacity=\".5\"/>\n        <g transform=\"translate(316 92) rotate(24)\">\n          <rect x=\"-46\" y=\"-14\" width=\"30\" height=\"28\" rx=\"2\" fill=\"#3B3F9E\" stroke=\"#8B7CF6\"/>\n          <rect x=\"16\" y=\"-14\" width=\"30\" height=\"28\" rx=\"2\" fill=\"#3B3F9E\" stroke=\"#8B7CF6\"/>\n          <path d=\"M-16 0h32\" stroke=\"#B9AEFF\" stroke-width=\"2\"/>\n          <rect x=\"-12\" y=\"-10\" width=\"24\" height=\"20\" rx=\"6\" fill=\"#E9E6FF\"/>\n          <circle cx=\"-4\" cy=\"0\" r=\"2\" fill=\"#5B5CF5\"/><circle cx=\"4\" cy=\"0\" r=\"2\" fill=\"#5B5CF5\"/>\n        <\/g>\n        <path class=\"twinkle\" d=\"M70 90 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z\" fill=\"#F7E7A8\"/>\n        <path class=\"twinkle\" style=\"animation-delay:1.2s\" d=\"M330 300 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z\" fill=\"#B9AEFF\"/>\n      <\/svg>\n    <\/div>\n  <\/header>\n\n  <section id=\"zones\">\n    <div class=\"sec-head\">\n      <span class=\"pill\">Activities<\/span>\n      <h2>Seven stops on your route<\/h2>\n      <p>Drop by each zone and get your QR code scanned to collect its stamp. Complete all seven to unlock your reward.<\/p>\n    <\/div>\n    <div class=\"zones\">\n      <article class=\"zone\"><span class=\"num\">01<\/span><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"7\" y=\"7\" width=\"10\" height=\"10\" rx=\"2\"/><path d=\"M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4\"/><\/svg><\/span><h3>AI Discovery<\/h3><p>See what today's AI can do, and try it for yourself.<\/p><\/article>\n      <article class=\"zone\"><span class=\"num\">02<\/span><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"/><path d=\"M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z\"/><\/svg><\/span><h3>Innovation Showcase<\/h3><p>New products and prototypes from local makers.<\/p><\/article>\n      <article class=\"zone\"><span class=\"num\">03<\/span><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z\"/><\/svg><\/span><h3>Smart Connections<\/h3><p>Cloud, connected devices and the smart city in action.<\/p><\/article>\n      <article class=\"zone\"><span class=\"num\">04<\/span><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z\"/><path d=\"M9 12l2 2 4-4\"/><\/svg><\/span><h3>Future Mobility<\/h3><p>How we'll move around the city next.<\/p><\/article>\n      <article class=\"zone\"><span class=\"num\">05<\/span><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><circle cx=\"12\" cy=\"5\" r=\"2\"/><circle cx=\"5\" cy=\"19\" r=\"2\"/><circle cx=\"19\" cy=\"19\" r=\"2\"/><path d=\"M12 7v5M12 12l-6 5.5M12 12l6 5.5\"/><\/svg><\/span><h3>Digital Playground<\/h3><p>Games, VR and interactive demos to play with.<\/p><\/article>\n      <article class=\"zone\"><span class=\"num\">06<\/span><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"3\" y=\"8\" width=\"18\" height=\"9\" rx=\"4.5\"/><circle cx=\"8.5\" cy=\"12.5\" r=\"2\"/><circle cx=\"15.5\" cy=\"12.5\" r=\"2\"/><\/svg><\/span><h3>Cyber Smart<\/h3><p>Spot the scam, protect your data and stay safe online.<\/p><\/article>\n      <article class=\"zone\"><span class=\"num\">07<\/span><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"7\" y=\"7\" width=\"10\" height=\"10\" rx=\"2\"/><path d=\"M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4\"/><\/svg><\/span><h3>Lucky Draw<\/h3><p>Scan in at the lucky draw stage before the draw begins.<\/p><\/article>\n      <article class=\"zone reward\"><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/><\/svg><\/span><div><h3>Lucky draw entry<\/h3><p>Unlocks automatically when all 7 stamps are collected.<\/p><\/div><\/article>\n    <\/div>\n  <\/section>\n\n  <section id=\"passport\" class=\"passport\">\n    <div>\n      <div class=\"sec-head\">\n        <span class=\"pill\">Your check-in pass<\/span>\n        <h2>One pass for the whole mission<\/h2>\n        <p>Your tech passport arrives with your registration. It's your check-in pass and your stamp card in one.<\/p>\n      <\/div>\n      <ol class=\"route\">\n        <li><span class=\"dot\">1<\/span><div><b>Check in with your QR<\/b><span>Show the QR on your passport at registration.<\/span><\/div><\/li>\n        <li><span class=\"dot\">2<\/span><div><b>Explore the zones<\/b><span>The crew scans you in at each activity and the stamp appears on your passport.<\/span><\/div><\/li>\n        <li><span class=\"dot\">3<\/span><div><b>Track your progress<\/b><span>See how many activities you've completed and how many are left.<\/span><\/div><\/li>\n        <li><span class=\"dot\">4<\/span><div><b>Unlock your reward<\/b><span>Complete all seven and your lucky draw entry unlocks.<\/span><\/div><\/li>\n      <\/ol>\n    <\/div>\n    <div>\n      <div class=\"phone\">\n        <iframe title=\"The Singapore Tech Experience digital passport, live\" loading=\"lazy\"\n          src=\"https://reg.eventnook.com/myorder/mysessions/eid_M7cwNDHVNXUxdTEFAA/12864701WJOJ?uid=a78145cc4f12ed8e004503a2488177a39807e4\"><\/iframe>\n      <\/div>\n      <p class=\"phone-cap\">A live sample passport. Scroll inside it, or <a href=\"https://reg.eventnook.com/myorder/mysessions/eid_M7cwNDHVNXUxdTEFAA/12864701WJOJ?uid=a78145cc4f12ed8e004503a2488177a39807e4\" target=\"_blank\" rel=\"noopener\">open it full screen<\/a>.<\/p>\n    <\/div>\n  <\/section>\n\n  <section id=\"faq\">\n    <div class=\"sec-head\">\n      <span class=\"pill\">Mission briefing<\/span>\n      <h2>Before you launch<\/h2>\n    <\/div>\n    <div class=\"faq\">\n      <div><h3>Do I need an app?<\/h3><p>No. Your passport opens in your phone's browser from your registration email.<\/p><\/div>\n      <div><h3>How do I collect a stamp?<\/h3><p>Show your QR code at the activity. Your passport updates as soon as the crew scans you in.<\/p><\/div>\n      <div><h3>Do I have to visit in order?<\/h3><p>No. Explore the zones in any order. Your progress bar keeps count.<\/p><\/div>\n      <div><h3>How do I enter the lucky draw?<\/h3><p>Collect all seven stamps and your entry unlocks on your passport.<\/p><\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"launch\">\n    <div>\n      <h2>Ready for launch?<\/h2>\n      <p>Open the sample passport and see the night sky your attendees will explore.<\/p>\n    <\/div>\n    <a class=\"btn btn-primary\" href=\"https://reg.eventnook.com/myorder/mysessions/eid_M7cwNDHVNXUxdTEFAA/12864701WJOJ?uid=a78145cc4f12ed8e004503a2488177a39807e4\" target=\"_blank\" rel=\"noopener\">Open the passport<\/a>\n  <\/div>\n\n  <footer><span>The Singapore Tech Experience · a sample event for showcase<\/span><span>Powered by <b>eventnook<\/b><\/span><\/footer>\n<\/div>\n<script>\n(function () {\n  var sky = document.getElementById(\"sky\"), out = \"\", seed = 7;\n  function r() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }\n  for (var i = 0; i < 140; i++) {\n    var x = (r() * 1000).toFixed(1), y = (r() * 1000).toFixed(1), s = (r() * 1.4 + .4).toFixed(2), o = (r() * .6 + .2).toFixed(2);\n    out += '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"' + s + '\" fill=\"#fff\" opacity=\"' + o + '\"' + (i % 9 === 0 ? ' class=\"twinkle\" style=\"animation-delay:' + (r() * 3).toFixed(1) + 's\"' : '') + '/>';\n  }\n  sky.innerHTML = out;\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "NexGen Careers", "tag": "Flight-path careers fair · five checkpoints to lift-off", "live": "https://nexgen-careers.eventnook.site/", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>NexGen Careers<\/title>\n<meta name=\"description\" content=\"A careers fair laid out as a flight path: five checkpoints on your digital passport, then lift-off at the launch pad.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=DM+Mono:wght@500&display=swap\" rel=\"stylesheet\">\n<style>\n/* Layout: a flight plan. The page climbs like the passport's trajectory: briefing, five checkpoints rising left to right, then the launch pad. */\n:root {\n  color-scheme: dark;\n  --space: #1E1A49;\n  --space-deep: #151236;\n  --space-hi: #251F57;\n  --violet: #7E76EE;\n  --violet-hi: #8E87F5;\n  --lilac: #ABA5FF;\n  --mist: #CFCBEA;\n  --mute: #B7B2DA;\n  --ink: #F1EFFF;\n  --gold: #F5B700;\n  --cyan: #9AE6FF;\n  --plum: rgba(150, 48, 118, .42);\n  --paper: #E7E4FF;\n  --paper-ink: #1A1530;\n  --line: rgba(255, 255, 255, .16);\n  --sans: \"DM Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --mono: \"DM Mono\", ui-monospace, Menlo, monospace;\n  --r: 24px;\n}\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; background: var(--paper); }\nbody {\n  margin: 0; color: var(--ink); font: 400 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;\n  background:\n    radial-gradient(1.5px 1.5px at 12px 18px, rgba(255,255,255,.9) 50%, transparent 55%) 0 0/83px 97px,\n    radial-gradient(1px 1px at 40px 60px, rgba(255,255,255,.65) 50%, transparent 55%) 0 0/61px 73px,\n    radial-gradient(1.3px 1.3px at 70px 30px, rgba(255,255,255,.5) 50%, transparent 55%) 0 0/127px 113px,\n    var(--space);\n}\na { color: inherit; }\nimg, svg, iframe { max-width: 100%; }\nh1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.03em; line-height: 1.06; text-wrap: balance; }\nh2 { font-size: clamp(32px, 4.6vw, 52px); }\nh3 { font-size: 21px; letter-spacing: -.02em; line-height: 1.15; }\nsection { padding-block: 88px; scroll-margin-top: 16px; }\n@media (max-width: 640px) { section { padding-block: 64px; } }\n.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 16px; }\n.kicker { display: inline-flex; align-items: center; gap: 12px; font: 700 13px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--mist); }\n.kicker::before { content: \"\"; width: 26px; height: 2px; border-radius: 2px; background: var(--violet-hi); }\n.lede { color: var(--mist); font-size: 19px; margin: 0; max-width: 40ch; }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 999px; font: 700 16px/1 var(--san th: 420px) { .nav .btn { display: none; } }\n\n/* hero */\n.hero { position: relative; padding-block: 40px 24px; overflow: hidden; }\n.hero::before { content: \"\"; position: absolute; inset: 0; background: linear-gradient(152deg, transparent 38%, var(--plum) 55%, transparent 72%); pointer-events: none; }\n.hero .wrap { position: relative; }\n.hero-top { display: grid; grid-template-columns: 1.25fr 1fr; gap: 48px; align-items: end; }\n.hero h1 { font-size: clamp(46px, 7.6vw, 96px); text-transform: uppercase; letter-spacing: -.035em; line-height: .96; margin-top: 22px; }\n.hero h1 .glow { color: var(--lilac); text-shadow: 0 0 34px rgba(142,135,245,.55); }\n.hero-side { display: grid; gap: 26px; padding-bottom: 8px; }\n.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }\n.facts { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; list-style: none; }\n.facts li { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.3); font-weight: 700; font-size: 15px; background: rgba(255,255,255,.04); }\n.facts b { color: var(--lilac); }\n.flight { margin-top: 44px; position: relative; }\n.flight svg { display: block; width: 100%; height: auto; overflow: visible; }\n.flight .lbl-svg { font: 700 17px var(--sans); fill: var(--ink); letter-spacing: -.01em; }\n.flight .lbl-sub { font: 500 13px var(--mono); fill: var(--lilac); letter-spacing: .08em; }\n.twinkle { animation: twinkle 2.6s ease-in-out infinite alternate; }\n.twinkle.d2 { animation-delay: -1.3s; }\n@keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }\n.bob { animation: bob 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }\n@keyframes bob { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-8px) rotate(6deg); } }\n@media (max-width: 900px) { .hero-top { grid-template-columns: 1fr; gap: 28px; } .flight { margin-top: 28px; } }\n@media (max-width  = 0; x &lt; 25; x++) {\n      if ((x &lt; 8 &amp;&amp; y &lt; 8) || (x &gt; 16 &amp;&amp; y &lt; 8) || (x &lt; 8 &amp;&amp; y &gt; 16)) continue;\n      if (rnd() &gt; .52) qr += `&lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;1&quot; height=&quot;1&quot; fill=&quot;#111&quot;/&gt;`;\n    }\n    qr = `&lt;svg viewBox=&quot;0 0 25 25&quot; shape-rendering=&quot;crispEdges&quot;&gt;${qr}${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}&lt;/svg&gt;`;\n  })();\n\n  document.body.insertAdjacentHTML(&#x27;beforeend&#x27;, `\n&lt;button id=&quot;scan&quot; type=&quot;button&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16&quot;/&gt;&lt;path d=&quot;M7 12h10&quot;/&gt;&lt;/svg&gt;&lt;span&gt;Tap to scan&lt;/span&gt;&lt;/button&gt;\n&lt;div class=&quot;scanner&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;vf&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;div class=&quot;qr&quot;&gt;${qr}&lt;/div&gt;&lt;b&gt;&lt;/b&gt;&lt;/div&gt;&lt;p&gt;Scanning in at&lt;strong&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;\n&lt;div class=&quot;toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;\n&lt;div class=&quot;fin&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;fin-t&quot;&gt;&lt;div class=&quot;fin-card&quot;&gt;&lt;div class=&quot;fin-ic&quot; aria-hidden=&quot;true&quot;&gt;${PP.finIcon || &#x27;🎉&#x27;}&lt;/div&gt;&lt;h2 id=&quot;fin-t&quot;&gt;${PP.finTitle}&lt;/h2&gt;&lt;p&gt;${PP.finText}&lt;/p&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;again&quot; type=&quot;button&quot;&gt;Start over&lt;/button&gt;&lt;button class=&quot;stay&quot; type=&quot;button&quot;&gt;Keep looking&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`);\n\n  const btn = $(&#x27;#scan&#x27;), scanner = $(&#x27;.scanner&#x27;), toastEl = $(&#x27;.toast&#x27;), fin = $(&#x27;.fin&#x27;);\n  const counts = () =&gt; ({ n: S.filter(s =&gt; s.done).length, T: S.length });\n\n  function render() {\n    const { n, T } = counts();\n    $$(&#x27;[data-count]&#x27;).forEach(e =&gt; e.textContent = n);\n    $$(&#x27;[data-total]&#x27;).forEach(e =&gt; e.textContent = T);\n    $$(&#x27;[data-left]&#x27;).forEach(e =&gt; e.textContent = T - n);\n    $$(&#x27;[data-pct]&#x27;).forEach(e =&gt; e.textContent = Math.round(n / T * 100) + &#x27;%&#x27;);\n    document.documentElement.style.setProperty(&#x27;--p&#x27;, (n / T).toFixed(4));\n    S.forEach((s, i) =&gt; $$(`[data-st=&quot;${i}&quot;]`).forEach(el =&gt; {\n      el.classList.toggle(&#x27;done&#x27;, !!s.done);\n      $$(&#x27;[data-time]&#x27;, el).forEach(t =&gt; t.textContent = s.time || &#x27;Just now&#x27;);\n    }));\n    btn.querySelector(&#x27;span&#x27;).textContent = n === T ? &#x27;Start over&#x27; : &#x27;Tap to scan&#x27;;\n    document.body.classList.toggle(&#x27;complete&#x27;, n === T);\n    if (PP.render) PP.render(n, T, S);\n  }\n\n  let tt;\n  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add(&#x27;on&#x27;); clearTimeout(tt); tt = setTimeout(() =&gt; toastEl.classList.remove(&#x27;on&#x27;), 2600); }\n\n  const next = () =&gt; S.findIndex(s =&gt; !s.done &amp;&amp; !s.auto);\n  let busy = false;\n\n  function scan() {\n    if (busy) return;\n    const { n, T } = counts();\n    if (n === T) { reset(); return; }\n    const i = next(); if (i &lt; 0) return;\n    busy = true;\n    $(&#x27;strong&#x27;, scanner).textContent = S[i].name;\n    scanner.classList.add(&#x27;on&#x27;);\n    setTimeout(() =&gt; {\n      scanner.classList.remove(&#x27;on&#x27;);\n      const el = $(`[data-st=&quot;${i}&quot;]`);\n      if (el) el.scrollIntoView({ block: &#x27;center&#x27;, behavior: reduce ? &#x27;auto&#x27; : &#x27;smooth&#x27; });\n      setTimeout(() =&gt; collect(i), reduce ? 60 : 560);\n    }, reduce ? 300 : 1150);\n  }\n\n  function collect(i) {\n    S[i].done = true; S[i].time = &#x27;Just now&#x27;;\n    render();\n    $$(`[data-st=&quot;${i}&quot;]`).forEach(el =&gt; { el.classList.remove(&#x27;just&#x27;); void el.offsetWidth; el.classList.add(&#x27;just&#x27;); setTimeout(() =&gt; el.classList.remove(&#x27;just&#x27;), 1500); });\n    toast((PP.onCollect &amp;&amp; PP.onCollect(i)) || `${S[i].name} collected · +1 pt`);\n    const { n, T } = counts();\n    if (n &lt; T) { busy = false; return; }\n    setTimeout(() =&gt; {\n      document.body.classList.add(&#x27;finale&#x27;);\n      if (PP.finale) PP.finale();\n      confetti();\n      setTimeout(() =&gt; { fin.classList.add(&#x27;on&#x27;); $(&#x27;.again&#x27;, fin).focus({ preventScroll: true }); busy = false; }, PP.finDelay || 1500);\n    }, 800);\n  }\n\n  function confetti() {\n    if (reduce) return;\n    const c = document.createElement(&#x27;div&#x27;); c.className = &#x27;conf&#x27;;\n    const cols = PP.confetti || [&#x27;#FF5C8A&#x27;, &#x27;#FFC93C&#x27;, &#x27;#5B8CFF&#x27;, &#x27;#3DD6A3&#x27;];\n    for (let k = 0; k &lt; 70; k++) {\n      const i = document.createElement(&#x27;i&#x27;);\n      i.style.cssText = `left:${Math.random() * 100}%;background:${cols[k % cols.length]};--d:${2.3 + Math.random() * 1.8}s;--dl:${Math.random() * .7}s;--dx:${(Math.random() - .5) * 170}px;--rot:${(Math.random() - .5) * 900}deg;${PP.confettiShape || &#x27;&#x27;}`;\n      c.appendChild(i);\n    }\n    document.body.appendChild(c); setTimeout(() =&gt; c.remove(), 5400);\n  }\n\n  function reset() {\n    fin.classList.remove(&#x27;on&#x27;); document.body.classList.remove(&#x27;finale&#x27;);\n    S.forEach((s, i) =&gt; { Object.assign(s, INIT[i]); if (!INIT[i].time) delete s.time; });\n    if (PP.reset) PP.reset();\n    render();\n    scrollTo({ top: 0, behavior: reduce ? &#x27;auto&#x27; : &#x27;smooth&#x27; });\n  }\n\n  btn.addEventListener(&#x27;click&#x27;, scan);\n  $(&#x27;.again&#x27;, fin).addEventListener(&#x27;click&#x27;, reset);\n  $(&#x27;.stay&#x27;, fin).addEventListener(&#x27;click&#x27;, () =&gt; fin.classList.remove(&#x27;on&#x27;));\n  addEventListener(&#x27;keydown&#x27;, e =&gt; { if (e.key === &#x27;Escape&#x27;) fin.classList.remove(&#x27;on&#x27;); });\n  render();\n})();\n\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\"><\/iframe>\n        <\/div>\n        <button class=\"btn btn-ghost\" type=\"button\" data-open-pp><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5\"/><\/svg>Try it full screen<\/button>\n        <p class=\"phone-cap\">A working demo. Press <b>Tap to scan<\/b> inside it to collect the next checkpoint.<\/p>\n      <\/div>\n      <div>\n        <span class=\"kicker\">Your digital passport<\/span>\n        <h2>Pre-flight in four steps<\/h2>\n        <p class=\"lede\">Every attendee gets a passport with their own trajectory. It opens in the browser from the confirmation email. Nothing to install.<\/p>\n        <ol class=\"countdown\">\n          <li><span class=\"t\">T–4<\/span><div><b>Open your passport<\/b><span>See your name, your trajectory and how many checkpoints stand between you and the launch pad.<\/span><\/div><\/li>\n          <li><span class=\"t\">T–3<\/span><div><b>Get scanned at a checkpoint<\/b><span>Show your QR to the crew at each stop. The checkpoint lights up and your astronaut floats on to the next one.<\/span><\/div><\/li>\n          <li><span class=\"t\">T–2<\/span><div><b>Watch the path light up<\/b><span>Each checkpoint you explore adds +1 pt and the count to the launch pad goes down.<\/span><\/div><\/li>\n          <li><span class=\"t\">T–1<\/span><div><b>Reach the launch pad<\/b><span>Explore all five and the rocket lifts off. Your prize is unlocked.<\/span><\/div><\/li>\n        <\/ol>\n        <div class=\"cta-row\">\n          <button class=\"btn btn-primary\" type=\"button\" data-open-pp>Try the passport full screen<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"checkpoints\">\n    <div class=\"wrap\">\n      <div class=\"cp-head\">\n        <div>\n          <span class=\"kicker\">The checkpoints<\/span>\n          <h2 style=\"margin-top:18px\">Five stops on the way up<\/h2>\n          <p class=\"lede\">Each checkpoint is a different way to explore a career. Every one is worth a point, and every point fuels the rocket.<\/p>\n        <\/div>\n        <div class=\"tally\" aria-label=\"5 points to collect\"><b>5<\/b><span>/5<\/span><small>POINTS TO COLLECT<\/small><\/div>\n      <\/div>\n\n      <ol class=\"cp\">\n        <svg class=\"cp-line\" viewBox=\"0 0 1000 252\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M100 220 L900 28\" fill=\"none\" stroke=\"rgba(185,180,255,.6)\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"0 11\" vector-effect=\"non-scaling-stroke\"/><\/svg>\n        <li class=\"cp-item\"><span class=\"disc\" aria-hidden=\"true\">1<\/span><div class=\"cp-card\"><span class=\"no\">CHECKPOINT 01<\/span><h3>Make a Connection<\/h3><span class=\"chip\">+1 pt<\/span><p>Start by meeting someone new: a recruiter, a mentor or another person figuring out their next move.<\/p><p class=\"do\"><strong>You:<\/strong> swap a hello and a name, then get scanned.<\/p><\/div><\/li>\n        <li class=\"cp-item\"><span class=\"disc\" aria-hidden=\"true\">2<\/span><div class=\"cp-card\"><span class=\"no\">CHECKPOINT 02<\/span><h3>Knowledge Boost<\/h3><span class=\"chip\">+1 pt<\/span><p>A short, practical session on the skills employers keep asking for, from CVs to interviews.<\/p><p class=\"do\"><strong>You:<\/strong> sit in, take one idea away, scan on the way out.<\/p><\/div><\/li>\n        <li class=\"cp-item\"><span class=\"disc\" aria-hidden=\"true\">3<\/span><div class=\"cp-card\"><span class=\"no\">CHECKPOINT 03<\/span><h3>Industry Bingo<\/h3><span class=\"chip\">+1 pt<\/span><p>Fill a bingo card by talking to people from different industries. A quick way to see fields you hadn't thought of.<\/p><p class=\"do\"><strong>You:<\/strong> complete a line, show your card, get scanned.<\/p><\/div><\/li>\n        <li class=\"cp-item\"><span class=\"disc\" aria-hidden=\"true\">4<\/span><div class=\"cp-card\"><span class=\"no\">CHECKPOINT 04<\/span><h3>Career Challenge<\/h3><span class=\"chip\">+1 pt<\/span><p>A bite-sized task based on a real job: solve a brief, sort a problem, pitch an idea.<\/p><p class=\"do\"><strong>You:<\/strong> give it a go. Trying is what counts.<\/p><\/div><\/li>\n        <li class=\"cp-item\"><span class=\"disc\" aria-hidden=\"true\">5<\/span><div class=\"cp-card\"><span class=\"no\">CHECKPOINT 05<\/span><h3>Spin to Win<\/h3><span class=\"chip\">+1 pt<\/span><p>The last stop before the launch pad. Spin the wheel and see what lands.<\/p><p class=\"do\"><strong>You:<\/strong> spin once, then head for lift-off.<\/p><\/div><\/li>\n      <\/ol>\n    <\/div>\n  <\/section>\n\n  <section id=\"launch\" class=\"launch\">\n    <div class=\"wrap launch-grid\">\n      <div class=\"pad-art\" aria-hidden=\"true\">\n        <svg viewBox=\"0 0 400 400\">\n          <defs>\n            <radialGradient id=\"glow\" cx=\"50%\" cy=\"70%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#7E76EE\" stop-opacity=\".55\"/><stop offset=\"1\" stop-color=\"#7E76EE\" stop-opacity=\"0\"/><\/radialGradient>\n            <radialGradient id=\"pg3\" cx=\"62%\" cy=\"34%\" r=\"70%\"><stop offset=\"0\" stop-color=\"#5A50B8\"/><stop offset=\".72\" stop-color=\"#3A3290\"/><\/radialGradient>\n          <\/defs>\n          <circle cx=\"200\" cy=\"230\" r=\"165\" fill=\"url(#glow)\"/>\n          <circle cx=\"330\" cy=\"90\" r=\"40\" fill=\"url(#pg3)\"/>\n          <ellipse cx=\"330\" cy=\"92\" rx=\"62\" ry=\"12\" fill=\"none\" stroke=\"rgba(214,198,160,.55)\" stroke-width=\"2.5\" transform=\"rotate(-13 330 92)\"/>\n          <g fill=\"#fff\"><circle class=\"twinkle\" cx=\"70\" cy=\"70\" r=\"2\"/><circle class=\"twinkle d2\" cx=\"120\" cy=\"150\" r=\"1.5\"/><circle class=\"twinkle\" cx=\"300\" cy=\"200\" r=\"1.8\"/><circle class=\"twinkle d2\" cx=\"50\" cy=\"240\" r=\"1.6\"/><circle class=\"twinkle\" cx=\"240\" cy=\"40\" r=\"1.4\"/><\/g>\n          <g transform=\"translate(110 60) scale(2.3)\">\n            <rect x=\"0\" y=\"0\" width=\"92\" height=\"122\" rx=\"16\" fill=\"rgba(20,18,52,.65)\" stroke=\"rgba(190,185,255,.75)\" stroke-width=\"1.6\" stroke-dasharray=\"6 5\"/>\n            <g stroke=\"#A9A3FF\" stroke-width=\"2\" fill=\"none\" opacity=\".75\"><path d=\"M16 112V30M27 112V30M16 42l11 12M27 42 16 54M16 66l11 12M27 66 16 78M16 90l11 12M27 90 16 102M27 48h12\"/><\/g>\n            <g class=\"lift\">\n              <path class=\"flick\" d=\"M44 90h12l-6 22z\" fill=\"#F5B700\"/><path class=\"flick\" d=\"M47 90h6l-3 12z\" fill=\"#FFF3C4\"/>\n              <path d=\"M50 18c11 11 13 32 10 62H40c-3-30-1-51 10-62z\" fill=\"#F2F0FF\"/>\n              <circle cx=\"50\" cy=\"48\" r=\"6.5\" fill=\"#4B44A8\" stroke=\"#8E87F5\" stroke-width=\"2\"/>\n              <path d=\"M40 64 30 80v7l11-5zM60 64l10 16v7l-11-5z\" fill=\"#8E87F5\"/><path d=\"M44 80h12l-2 9h-8z\" fill=\"#B9B4FF\"/>\n            <\/g>\n            <path d=\"M8 114h76\" stroke=\"#8E87F5\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n          <\/g>\n        <\/svg>\n      <\/div>\n      <div>\n        <span class=\"kicker\">Final stop · the launch pad<\/span>\n        <h2 style=\"margin-top:18px\">Five checkpoints, then <span class=\"gold\">lift-off<\/span><\/h2>\n        <p class=\"lede\">When the last checkpoint is explored, your passport clears you for lift-off: the rocket launches, the confetti falls and your prize is unlocked.<\/p>\n        <div class=\"fuel\" role=\"img\" aria-label=\"Fuel gauge: one segment per checkpoint, five to fill\">\n          <div class=\"fuel-bar\"><i class=\"on\"><\/i><i class=\"on\"><\/i><i class=\"on\"><\/i><i class=\"on\"><\/i><i class=\"on\"><\/i><\/div>\n          <div class=\"fuel-lbl\"><span>1 checkpoint = 1 pt<\/span><b>5 / 5 · Cleared for lift-off<\/b><\/div>\n        <\/div>\n        <ul class=\"perks\">\n          <li><b>One prize, no maths<\/b><span>No tiers to work out. Explore all five and it's yours.<\/span><\/li>\n          <li><b>Collect at the launch pad<\/b><span>Show the crew your passport with all five lit up.<\/span><\/li>\n        <\/ul>\n        <button class=\"btn btn-primary\" type=\"button\" data-open-pp><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3c3 3 4 8 3 13H9C8 11 9 6 12 3zM9 16l-3 4M15 16l3 4M12 19v2\"/><\/svg>Watch the lift-off<\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"faq\" class=\"faq-sec\">\n    <div class=\"wrap faq-grid\">\n      <div>\n        <span class=\"kicker\">Good to know<\/span>\n        <h2>Questions before take-off<\/h2>\n        <p class=\"note\">The short version: one passport, five checkpoints, one point each, a prize at the end.<\/p>\n      <\/div>\n      <div class=\"faq-list\">\n        <details class=\"faq-item\" open><summary class=\"faq-q\">Do I need to download an app?<\/summary><p class=\"faq-a\">No. Your passport opens in the browser from the link in your confirmation email. Keep it handy on your phone.<\/p><\/details>\n        <details class=\"faq-item\"><summary class=\"faq-q\">How do I collect a checkpoint?<\/summary><p class=\"faq-a\">Show your passport QR to the crew at the checkpoint. Once they scan it, the checkpoint turns to explored and +1 pt lands straight away.<\/p><\/details>\n        <details class=\"faq-item\"><summary class=\"faq-q\">Do I have to go in order?<\/summary><p class=\"faq-a\">The trajectory suggests a route, but every checkpoint counts whenever you reach it. Your passport always shows what's left.<\/p><\/details>\n        <details class=\"faq-item\"><summary class=\"faq-q\">Can a checkpoint count twice?<\/summary><p class=\"faq-a\">No. Each checkpoint is worth one point, once. Five different checkpoints get you to the launch pad.<\/p><\/details>\n        <details class=\"faq-item\"><summary class=\"faq-q\">How do I claim my prize?<\/summary><p class=\"faq-a\">When all five are explored, your passport shows Lift-off and unlocks the prize. Head to the launch pad and show the crew your screen.<\/p><\/details>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"closing-sec\">\n    <div class=\"wrap\">\n      <div class=\"closing\">\n        <span class=\"planet\" aria-hidden=\"true\"><\/span>\n        <div>\n          <h2>Ready for lift-off?<\/h2>\n          <p>Open the sample passport, scan your way through all five checkpoints and watch the rocket go.<\/p>\n        <\/div>\n        <button class=\"btn btn-primary\" type=\"button\" data-open-pp>Open the passport<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/main>\n\n<footer>\n  <div class=\"wrap\"><span>NexGen Careers · a sample event for showcase<\/span><span>Powered by <b>eventnook<\/b><\/span><\/div>\n<\/footer>\n\n<div class=\"ov\" id=\"pp-ov\" role=\"dialog\" aria-modal=\"true\" aria-label=\"NexGen Careers passport, full screen\">\n  <button class=\"ov-close\" type=\"button\" id=\"pp-close\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"/><\/svg>Close<\/button>\n  <div class=\"ov-frame\" id=\"pp-ov-frame\"><\/div>\n<\/div>\n\n<script>\n(function () {\n  var ov = document.getElementById('pp-ov');\n  var holder = document.getElementById('pp-ov-frame');\n  var closeBtn = document.getElementById('pp-close');\n  var src = document.getElementById('pp-embed').getAttribute('srcdoc');\n  var last = null;\n  function open(e) {\n    last = e.currentTarget;\n    holder.innerHTML = '';\n    var f = document.createElement('iframe');\n    f.title = 'NexGen Careers digital passport, full screen';\n    f.setAttribute('srcdoc', src);\n    holder.appendChild(f);\n    ov.classList.add('on');\n    document.body.classList.add('no-scroll');\n    closeBtn.focus();\n  }\n  function close() {\n    if (!ov.classList.contains('on')) return;\n    ov.classList.remove('on');\n    document.body.classList.remove('no-scroll');\n    holder.innerHTML = '';\n    if (last) last.focus();\n  }\n  document.querySelectorAll('[data-open-pp]').forEach(function (b) { b.addEventListener('click', open); });\n  closeBtn.addEventListener('click', close);\n  ov.addEventListener('click', function (e) { if (e.target === ov) close(); });\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape') close();\n    if (e.key === 'Tab' && ov.classList.contains('on')) { e.preventDefault(); closeBtn.focus(); }\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "Sustainability First: an ESG Summit", "tag": "A garden that grows · five stations to full bloom", "live": "https://sustainability-first.eventnook.site/", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Sustainability First: an ESG Summit<\/title>\n<meta name=\"description\" content=\"A summit about doing business more sustainably. Visit five stations and your digital passport grows a garden as you go.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap\" rel=\"stylesheet\">\n<style>\n/* Layout: a garden that grows down the page. The hero is a planted bed of five plots,\n   the stations are the same five plots up close, and the finale is the bed in full bloom. */\n:root {\n  color-scheme: light;\n  --leaf: #65AA60;        /* passport ground, top */\n  --leaf-2: #4D8D49;      /* passport ground, bottom */\n  --leaf-deep: #2E6B33;   /* passport toast */\n  --forest: #1D4421;\n  --ink: #17301A;\n  --mute: #4C6150;\n  --vine: #7DBE6C;\n  --stem: #4CAF62;\n  --peri: #7C7CF2;        /* passport button + stamp */\n  --peri-ink: #5654D4;    /* darker periwinkle for text and buttons on light */\n  --peri-2: #8C88FF;\n  --lilac: #B48CF2;\n  --sun: #F5C243;\n  --sun-2: #D8C540;\n  --soil: #6A3D20;\n  --clay: #E2A36B;\n  --sprout: #E4F6CF;      /* passport finale icon ground */\n  --mist: #F3F8EC;\n  --card: #FFFFFF;\n  --line: #D9E7CF;\n  --pink: #F4A6C8;\n  --focus: var(--peri-ink);\n  --font: \"DM Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --r: 24px;\n  --gut: 16px;\n}\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody { margin: 0; background: var(--mist); color: var(--ink); font: 400 17px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }\na { color: inherit; }\nimg, svg, iframe { max-width: 100%; display: block; }\nh1, h2, h3 { margin: 0; font-family: var(--font); font-weight: 800; letter-spacing: -.035em; line-height: 1.04; text-wrap: balance; }\nh2 { font-size: clamp(32px, 4.6vw, 54px); }\nh3 { font-size: 21px; letter-spacing: -.02em; line-height: 1.2; }\n*:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }\n\n.wrap { max-width: 1232px; margin: 0 auto; padding-inline: var(--gut); }\n.eyebrow { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--peri-ink); }\n.on-dark { color: #fff; --focus: var(--sun); }\n.on-dark .eyebrow { color: #fff; opacity: .85; }\n.lede { font-size: 19px; color: var(--mute); max-width: ssport<\/button>\n    <\/nav>\n\n    <div class=\"hero-body\">\n      <div>\n        <span class=\"eyebrow\">Sustainability First: an ESG Summit<\/span>\n        <h1><span>Visit five stations.<\/span> <span class=\"bloom\">Leave in full bloom.<\/span><\/h1>\n        <p class=\"lede\">A summit about running things more sustainably, from what we make to how we move and how we look after people. Each station you visit plants a flower in your digital passport.<\/p>\n        <div class=\"pills\">\n          <span class=\"pill\">5 stations<\/span>\n          <span class=\"pill\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M5 19c0-8 5-13 14-14-1 9-6 14-14 14zM5 19l7-7\"/><\/svg>1 pt each<\/span>\n          <span class=\"pill\">1 prize at full bloom<\/span>\n        <\/div>\n        <div class=\"ctas\">\n          <a class=\"btn btn-peri\" href=\"#passport\">See how the passport works<\/a>\n          <a class=\"btn btn-line\" href=\"#stations\">Meet the stations<\/a>\n        <\/div>\n      <\/div>\n      <div class=\"ring-card\" aria-hidden=\"true\">\n        <div class=\"ring\"><svg viewBox=\"0 0 100 100\"><circle class=\"trk\" cx=\"50\" cy=\"50\" r=\"42\"/><circle class=\"arc\" cx=\"50\" cy=\"50\" r=\"42\"/><\/svg><div class=\"lbl\"><b>5<\/b><small>of 5<\/small><\/div><\/div>\n        <p><strong>In full bloom<\/strong>Five stations, five flowers, one prize unlocked.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"bed\" aria-hidden=\"true\">\n    <div class=\"sun\"><\/div>\n    <div class=\"plots\">\n      <div class=\"plot\" style=\"--i:0\"><svg class=\"fl\" viewBox=\"0 0 60 150\" aria-hidden=\"true\"><path d=\"M30 150Q27 104 30 58\" fill=\"none\" stroke=\"#4CAF62\" stroke-width=\"3.2\" stroke-linecap=\"round\"/><ellipse cx=\"41\" cy=\"120\" rx=\"11\" ry=\"5\" fill=\"#5DBF6E\" transform=\"rotate(-30 41 120)\"/><ellipse cx=\"30\" cy=\"42\" rx=\"7\" ry=\"11\" fill=\"#7C7CF2\" transfo ne}\n.fin-ic{font-size:42px;line-height:1;width:86px;height:86px;margin:-74px auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--fin-bg,#FFE27A);box-shadow:0 0 0 7px #fff}\n.fin h2{font-size:25px;letter-spacing:-.02em;line-height:1.1}\n.fin p{font-size:15px;line-height:1.45;margin-top:8px;color:#4B4763}\n.fin .acts{display:grid;gap:8px;margin-top:20px}\n.fin .acts button{height:48px;border-radius:999px;font-weight:700;font-size:15px}\n.fin .again{background:var(--btn,#1E0E62);color:var(--btn-ink,#fff)}\n.fin .stay{background:#F1EFF7;color:#1A1530}\n\n/* confetti */\n.conf{position:fixed;inset:0;pointer-events:none;z-index:75;overflow:hidden}\n.conf i{position:absolute;top:-24px;width:9px;height:14px;border-radius:2px;animation:fall var(--d) cubic-bezier(.3,.5,.4,1) var(--dl) forwards}\n@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}\n\n/* the stamp landing */\n.just.stamp,.just .stamp{animation:stampIn .75s cubic-bezier(.2,.8,.2,1.3)}\n@keyframes stampIn{0%{transform:scale(1.4) rotate(var(--r,0deg));opacity:.25}55%{transform:scale(.93) rotate(var(--r,0deg));opacity:1}100%{transform:scale(1) rotate(var(--r,0deg))}}\n\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}\n\n:root{--btn:#7C7CF2;--btn-ink:#fff;--toast:#2E6B33;--scan:#C6F59A;--fin-bg:#E4F6CF}\nbody{background:#4B8A47;color:#fff}\n.top h1{text-transform:uppercase;font-size:17px;letter-spacing:.005em}\nmain{background:linear-gradient(180deg,#65AA60 0%,#589B53 35%,#4D8D49 100%);overflow:hidden}\n.vine{position:absolute;pointer-events:none}\n.v1{right:-10px;top:-8px;width:170px}\n.v2{left:-18px;bottom:40px;width:150px;transform:scaleX(-1) rotate(160deg)}\n.head{position:relative;display:flex;gap:22px;align-items:center;padding:26px 22px 20px}\n.ring{position:relative;width:100px;height:100px;flex:none}\n.ring svg{width:100%;height:100
